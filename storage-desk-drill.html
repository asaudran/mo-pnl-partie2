/* ---------------- CASE STUDIES ---------------- */
{id:'cs1', theme:'cases',
 scenario:`Une batterie merchant 100 MW / 400 MWh (4h, LFP) opère en ERCOT North Hub, sans aucun contrat de couverture (fully merchant). Un après-midi d'été, une vague de chaleur fait spiker le prix Real-Time à 5 000 $/MWh pendant 2 heures. Or, la batterie était déchargée à ce moment précis (SOC bas), suite à une mauvaise anticipation de la trajectoire de charge la nuit précédente.`,
 q:`Quel type de risque s'est matérialisé ici ?`,
 options:[`Un risque de contrepartie`,`Un risque de dispatch/optimisation : l'actif n'était pas positionné (SOC) pour capter le pic de prix au bon moment`,`Un risque de change devise`,`Un risque réglementaire lié au plafond de prix`], correct:1,
 explain:`Cas typique de risque de dispatch : la valeur de l'actif dépend entièrement de la qualité de la décision de trading (ici, la gestion prévisionnelle du SOC). Une meilleure prévision de prix et une gestion plus prudente du SOC auraient permis de capter ce pic.`},
{id:'cs2', theme:'cases',
 scenario:`Le sponsor d'un projet batterie 200 MW / 400 MWh souhaite réduire la volatilité de son revenu pour faciliter le financement bancaire (dette senior), sans pour autant renoncer à tout potentiel de hausse en cas de bon marché.`,
 q:`Quelle structure contractuelle correspond le mieux à cet objectif ?`,
 options:[`Fully merchant pur`,`Tolling Agreement à fee 100% fixe`,`Une structure merchant avec floor (ou cap & floor / collar), garantissant un plancher de revenu tout en conservant une partie de l'upside`,`Un PPA physique classique de type baseload`], correct:2,
 explain:`Le fully merchant maximise l'upside mais ne sécurise rien pour les prêteurs ; le tolling pur sécurise tout mais supprime tout upside. Une structure floor (ou collar) est le compromis classique recherché ici, réduisant le risque de crédit du financement tout en laissant une participation au marché.`},
{id:'cs3', theme:'cases',
 scenario:`Un actif éolien signe un Financial PPA "all-in" réglé contre le prix du North Hub. Quelques mois plus tard, une nouvelle contrainte de transport (congestion) apparaît entre le nœud physique de l'actif et le North Hub, faisant durablement chuter le prix nodal réel en dessous du prix du hub.`,
 q:`Qui porte le risque de cette divergence de prix (basis), et comment pourrait-il s'en couvrir ?`,
 options:[`L'acheteur du PPA porte seul ce risque, sans solution de couverture possible`,`Le vendeur/générateur porte ce risque de base (il vend au prix nodal réel, mais son PPA règle contre le hub) — il peut se couvrir via des Congestion Revenue Rights (CRR) ou un basis swap dédié`,`Ni l'acheteur ni le vendeur, ce risque n'existe pas dans un PPA financier`,`Le régulateur ERCOT compense automatiquement cette différence`], correct:1,
 explain:`Dans un PPA financier réglé sur un hub, le générateur reste exposé à la différence entre son prix nodal réel et le prix du hub de référence contractuel — le risque de base géographique classique, pour lequel les CRR ou basis swaps sont les instruments de couverture dédiés.`},
{id:'cs4', theme:'cases',
 scenario:`Un générateur signe un Financial PPA indexé Day-Ahead (DA). Lors d'une vague de chaleur non anticipée par le marché DA de la veille, le prix Real-Time s'envole bien au-dessus du prix DA clairé pour les mêmes heures.`,
 q:`Quel est l'effet net, ce jour-là, sur la position du générateur ?`,
 options:[`Aucun effet, DA et RT sont toujours identiques`,`Le générateur vend son énergie physique réelle au prix RT (élevé) — un gain sur le marché spot — mais son règlement de PPA reste indexé sur le DA (plus bas), révélant une exposition résiduelle au risque de base DA-RT non couverte par ce type de PPA`,`Le générateur perd automatiquement tout son revenu ce jour-là`,`Le PPA financier DA élimine totalement ce risque par construction`], correct:1,
 explain:`Exactement le risque de base DA-RT : indexer un PPA financier sur le DA plutôt que sur le RT laisse un écart de convergence non couvert, qui peut jouer favorablement (comme ici) ou défavorablement selon le sens du spike.`},
{id:'cs5', theme:'cases',
 scenario:`Une banque agit comme "toller" sur une batterie 150 MW / 300 MWh, en échange d'un fee fixe payé au propriétaire de l'actif. La banque porte donc l'intégralité du risque de marché (spread, AS).`,
 q:`Comment la banque (le toller) peut-elle elle-même gérer ce risque de marché qu'elle a désormais entièrement absorbé ?`,
 options:[`Elle ne peut absolument rien faire, le risque est intégralement subi`,`En optimisant activement le dispatch (trading day-ahead et real-time), en diversifiant sur un portefeuille d'actifs, et en couvrant partiellement via des instruments de spread/options quand c'est possible`,`En revendant immédiatement la batterie`,`En augmentant unilatéralement le fee payé au propriétaire`], correct:1,
 explain:`Le toller devient de facto le trader/optimiseur de l'actif : il gère le risque qu'il a acheté via son expertise de trading, la diversification de portefeuille et, dans la mesure du possible, des instruments financiers partiels — précisément le métier des banques et trading houses actives sur ce segment.`},
{id:'cs6', theme:'cases',
 scenario:`Un gestionnaire de portefeuille de batteries ERCOT observe que le revenu par MW issu des services auxiliaires de ses actifs a chuté d'environ 90% en deux ans, alors que le parc total de batteries sur ERCOT est passé de quelques GW à environ 14 GW sur la même période.`,
 q:`Quelle réorientation stratégique ce constat appelle-t-il logiquement ?`,
 options:[`Continuer à optimiser exclusivement pour les services auxiliaires, la tendance va s'inverser d'elle-même`,`Réorienter la stratégie d'optimisation vers l'arbitrage énergie (spread capture), en utilisant la flexibilité accrue de co-optimisation temps réel introduite par RTC+B pour basculer dynamiquement entre positions énergie et AS`,`Arrêter totalement d'opérer les batteries en ERCOT`,`Demander un remboursement à ERCOT pour perte de revenu`], correct:1,
 explain:`Exactement le virage stratégique observé sur le marché réel : face à la saturation structurelle des AS, la valeur se déplace vers l'arbitrage énergie, et RTC+B fournit précisément l'outil (co-optimisation 5 minutes) pour exploiter cette flexibilité entre les deux poches de valeur.`},
{id:'cs7', theme:'cases',
 scenario:`Avant décembre 2025, un trader devait essentiellement décider de la répartition énergie/AS de sa batterie au moment de l'enchère Day-Ahead, avec une flexibilité limitée en intraday. Depuis le lancement de RTC+B, ce même trader dispose d'un outil de dispatch radicalement différent.`,
 q:`Qu'est-ce qui a concrètement changé dans la mécanique de marché ?`,
 options:[`Rien, RTC+B n'a changé que le nom du produit AS`,`SCED co-optimise désormais conjointement l'énergie et les services auxiliaires toutes les 5 minutes en tenant compte du SOC réel télémesuré, remplaçant l'ORDC par des courbes de demande AS (ASDC) intégrées au dispatch temps réel`,`Le Day-Ahead Market a été purement et simplement supprimé`,`Les batteries n'ont plus le droit de fournir de services auxiliaires`], correct:1,
 explain:`RTC+B (live depuis le 5 décembre 2025) transforme le dispatch temps réel en un mécanisme continu de co-optimisation énergie + AS, avec un suivi SOC en continu — une flexibilité bien supérieure à l'ancien schéma où l'essentiel de la position AS se figeait au DAM la veille.`},
{id:'cs8', theme:'cases',
 scenario:`Dans une zone à forte pénétration solaire du réseau ERCOT, les prix Real-Time deviennent régulièrement proches de zéro, voire négatifs, en milieu de journée, tandis qu'un pic de prix apparaît en fin d'après-midi/soirée lors de la rampe de charge nette ("duck curve").`,
 q:`Quelle est la réponse la plus cohérente, à la fois opérationnelle et en termes de dimensionnement, à ce phénomène ?`,
 options:[`Ignorer le phénomène, il n'a aucun impact sur la valorisation`,`Charger la batterie pendant les heures de prix bas/négatifs de milieu de journée et décharger lors de la rampe du soir ; privilégier des durées plus longues (proche de 4h) pour capter toute l'amplitude de la rampe`,`Décharger systématiquement à midi quand le solaire produit le plus`,`Ne jamais charger lorsque les prix sont négatifs`], correct:1,
 explain:`Illustration directe du lien entre pénétration solaire, "duck curve" et dimensionnement optimal du stockage : plus la rampe du soir est ample, plus une durée de batterie longue (4h) permet de capter la totalité du mouvement de prix.`},
{id:'cs9', theme:'cases',
 scenario:`Un actif merchant a acheté un Revenue Put auprès d'une banque pour sécuriser un plancher de revenu annuel. Deux ans plus tard, une année de prix très bas rend le put largement "in the money" (la banque doit un paiement important au propriétaire de l'actif) — au même moment, la banque traverse des difficultés financières sévères.`,
 q:`Quel risque, distinct du risque de prix initialement couvert, se matérialise potentiellement ici ?`,
 options:[`Un risque de dégradation de la batterie`,`Un risque de contrepartie/crédit : la capacité de la banque à honorer son paiement devient incertaine au moment précis où le propriétaire en a le plus besoin`,`Un risque météorologique`,`Un risque de change devise`], correct:1,
 explain:`Acheter une couverture ne supprime pas le risque, il le transforme : le risque de prix devient un risque de contrepartie sur l'institution qui a vendu la protection — d'où l'importance de la collatéralisation, des limites de crédit et de la diversification des contreparties.`},
{id:'cs10', theme:'cases',
 scenario:`Le PUCT a précédemment abaissé le plafond système de 9 000 $/MWh à 5 000 $/MWh, puis RTC+B a introduit un plafond distinct et plus bas en temps réel (2 000 $/MWh contre 5 000 $/MWh en Day-Ahead). Un actif merchant dont le business plan reposait fortement sur la capture de pics de rareté en Real-Time voit son modèle de revenu affecté.`,
 q:`De quel type de risque déjà rencontré s'agit-il, et quelle en est l'implication pratique pour le middle office ?`,
 options:[`Un simple risque de change, sans implication pratique`,`Un risque réglementaire structurel, qui doit être suivi en continu (veille PUCT/ERCOT) et intégré explicitement dans la révision périodique des modèles de valorisation, au même titre que le risque de marché`,`Un risque météorologique ponctuel sans suite`,`Aucun risque, les plafonds de prix n'ont jamais d'effet réel`], correct:1,
 explain:`Un risque réglementaire au sens plein : une décision de politique de marché redéfinit directement l'enveloppe de revenu potentiel d'un actif, indépendamment des fondamentaux physiques — d'où la nécessité, pour un middle office, d'une veille réglementaire active et d'une révision régulière des hypothèses de valorisation.`},
{id:'cs11', theme:'cases',
 scenario:`Le propriétaire d'une batterie 100 MW / 400 MWh vend un "TB4 swap" à une banque : il reçoit un montant fixe garanti ($/MW-an), et la banque reçoit en échange la valeur flottante de l'indice TB4 réalisé chaque jour sur le marché Day-Ahead. Quelques mois plus tard, une panne partielle de l'onduleur réduit la disponibilité réelle de la batterie pendant deux semaines, l'empêchant de capter sa part habituelle du spread journalier.`,
 q:`Qui supporte la perte de revenu liée à cette panne, sachant que le swap est réglé sur l'indice TB4 et non sur la performance réelle de l'actif ?`,
 options:[`La banque, puisqu'elle est contrepartie du swap`,`Le propriétaire de la batterie : le TB4 continue d'être calculé sur les prix de marché indépendamment de la disponibilité réelle de son actif ; une panne réduit sa capacité à capter ce même TB4 en interne, sans réduire ce qu'il doit à la banque au titre du swap`,`ERCOT indemnise automatiquement la panne`,`Personne, le swap s'annule automatiquement en cas de panne`], correct:1,
 explain:`C'est la nature même d'un hedge indexé sur un proxy de marché (TBX, comme un revenue put) : il isole le risque de PRIX (le niveau du spread journalier) mais laisse au propriétaire l'intégralité du risque de PERFORMANCE opérationnelle de son propre actif (disponibilité, dégradation, panne). Le swap ne "sait" rien de la panne — seul l'indice TB4 de marché compte pour son règlement.`}
];

var FICHES = [
 {ticker:'PHY', title:'PPA Physique', body:`Le vendeur livre réellement l'énergie à un point de livraison défini (souvent un hub). L'acheteur en prend le titre de propriété à ce point et porte ensuite le risque de base jusqu'à son propre nœud/charge.`, note:`Utilisé quand l'acheteur a un besoin physique réel (utility, load-serving entity) ou une obligation de livraison.`},
 {ticker:'FIN', title:'PPA Financier (Virtual PPA / CfD)', body:`Aucune livraison physique : le vendeur vend sa production sur son marché spot local, et règle séparément la différence avec l'acheteur (strike fixe contre indice flottant, souvent le prix d'un hub) — un pur "contract for differences".`, note:`Le générateur porte le risque de base entre son nœud physique et le hub utilisé comme référence dans le PPA.`},
 {ticker:'ALL', title:`Financial PPA "All-in"`, body:`Variante où le prix fixe (strike) s'applique à 100% du volume réellement produit ("as produced"), sans ajustement de forme ni de volume ferme — le prix unique intègre déjà les primes de risque de forme/volume/base.`, note:`À distinguer d'un PPA "shaped/baseload" où un volume fixe est contracté indépendamment de la production réelle.`},
 {ticker:'DA', title:`Financial PPA "DA"`, body:`Le règlement flottant utilise l'indice Day-Ahead plutôt que le Real-Time. Le générateur est réellement payé au prix RT pour son énergie physique — il conserve donc un risque de base DA-RT en plus du risque de base géographique.`, note:`Souvent choisi pour la meilleure liquidité des produits de couverture indexés DA — au prix d'un risque de convergence DA/RT résiduel.`},
 {ticker:'TOL', title:'Tolling Agreement', body:`Pas un PPA à proprement parler : l'actif est mis à disposition d'un "toller" qui reçoit les droits de dispatch contre un paiement fixe. Le propriétaire touche un revenu prévisible ; tout le risque marché (spread, AS) est transféré au toller.`, note:`Le toller décide seul de la stratégie d'enchère — il capte l'upside et porte le downside.`},
 {ticker:'MER', title:`Merchant / Floor / Cap & Floor`, body:`Fully merchant : 100% du risque/upside chez le propriétaire. Merchant + floor : un plancher de revenu est garanti, l'upside restant au propriétaire. Cap & Floor (parfois appelé "collar") : revenu plafonné ET plancher, l'excédent au-delà du cap étant partagé/reversé.`, note:`Terminologie variable selon les desks ("collar", "corridor"). Ne pas confondre avec le TBX Swap ci-dessous, qui est un instrument différent malgré un nom proche.`},
 {ticker:'RA', title:'Resource Adequacy / Capacity', body:`Rémunère la disponibilité/capacité accréditée d'un actif plutôt que l'énergie produite. ERCOT reste un marché "energy-only" sans marché de capacité centralisé comme PJM, même si des mécanismes de fiabilité complémentaires évoluent.`, note:`Pour le stockage, l'accréditation de capacité (type ELCC) dépend fortement de la durée de la batterie.`},
 {ticker:'PUT', title:'Revenue Put / Proxy Revenue Swap', body:`Instrument acheté par le sponsor auprès d'une banque/assureur, garantissant un plancher de revenu basé sur un indice/portefeuille "proxy" — et non sur la performance réelle de l'actif.`, note:`Contrairement au tolling, le propriétaire garde le contrôle du dispatch et l'upside ; il achète seulement une protection de prix.`},
 {ticker:'TBX', title:'TBX Swap (Top-Bottom)', body:`"Top-Bottom X" (TB1, TB2, TB4...) : indice qui prend, pour chaque journée, la moyenne des X prix Day-Ahead les plus hauts moins la moyenne des X prix Day-Ahead les plus bas. C'est le benchmark standard du secteur pour estimer le revenu d'arbitrage théorique maximal d'une batterie de durée X, à prévision parfaite et 1 cycle/jour. Un "TBX swap" est un swap fixe-flottant construit sur cet indice : le propriétaire reçoit un montant fixe ($/MW-an) contre la valeur flottante du TBX réalisé.`, note:`Le swap se règle sur l'INDICE de marché, pas sur la performance réelle de l'actif : si la batterie capture moins que le TBX (pertes RTE, contraintes opérationnelles...), cet écart de "capture rate" reste à la charge du propriétaire.`}
];

var STORAGE_KEY = 'battery-desk-drill-v1';
var progress = {};
try{ progress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ progress = {}; }

function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}
function entry(id){
  return progress[id] || {wrong:0, streak:0, needsReview:false, attempted:false};
}
function record(id, ok){
  var e = entry(id);
  e.attempted = true;
  if(ok){
    e.streak = (e.streak||0) + 1;
    if(e.needsReview && e.streak >= 2){ e.needsReview = false; }
  } else {
    e.wrong = (e.wrong||0) + 1;
    e.streak = 0;
    e.needsReview = true;
  }
  progress[id] = e;
  saveProgress();
}

function themeStats(key){
  var qs = QUESTIONS.filter(function(q){ return q.theme === key; });
  var total = qs.length, attempted = 0, mastered = 0, due = 0;
  qs.forEach(function(q){
    var e = entry(q.id);
    if(e.attempted) attempted++;
    if(e.attempted && !e.needsReview) mastered++;
    if(e.needsReview) due++;
  });
  return {total:total, attempted:attempted, mastered:mastered, due:due};
}
function globalStats(){
  var total = QUESTIONS.length, mastered = 0, due = 0;
  QUESTIONS.forEach(function(q){
    var e = entry(q.id);
    if(e.attempted && !e.needsReview) mastered++;
    if(e.needsReview) due++;
  });
  return {total:total, mastered:mastered, due:due, pct: total ? Math.round(100*mastered/total) : 0};
}
function reviewQueue(){
  return QUESTIONS.filter(function(q){ return entry(q.id).needsReview; });
}

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function esc(s){
  return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; });
}

function startSession(queue, label){
  if(queue.length === 0){ app.view = (app.view==='quiz'?'dashboard':app.view); render(); return; }
  session = {queue:shuffle(queue), index:0, label:label, correctCount:0, wrongCount:0, missed:[], answered:false};
  app.view = 'quiz';
  render();
}

/* =========================================================
   GAME ENGINE — PnL Maker
   ========================================================= */
var GAME_LEN = 10;
var RISK_LIMIT = -400;      // k$ : sous ce seuil, le risk management coupe les limites
var HEDGE_FIXED = 95;       // k$/jour : jambe fixe du TB4 swap
var QUIZ_BONUS = 80;
var QUIZ_MALUS = -60;
var BEST_KEY = 'battery-desk-drill-best-v1';
var game = null;

function getBest(){
  try{ return parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; }catch(e){ return 0; }
}
function saveBest(){
  try{ if(game && game.pnl > getBest()) localStorage.setItem(BEST_KEY, String(game.pnl)); }catch(e){}
}
function pickOutcome(outcomes){
  var r = Math.random(), acc = 0;
  for(var i=0;i<outcomes.length;i++){
    acc += outcomes[i].p;
    if(r <= acc) return outcomes[i];
  }
  return outcomes[outcomes.length-1];
}
function pickGameQuestion(){
  var due = reviewQueue();
  var pool = due.length ? due : QUESTIONS.filter(function(q){ return !entry(q.id).attempted; });
  if(!pool.length) pool = QUESTIONS;
  return shuffle(pool)[0];
}
function gameStart(){
  var pool = shuffle(GAME_SCENARIOS), si = 0, plan = [];
  for(var d=1; d<=GAME_LEN; d++){
    if(d % 3 === 0) plan.push({type:'quiz'});
    else plan.push({type:'market', scenario: pool[si++ % pool.length]});
  }
  game = {plan:plan, day:0, pnl:0, history:[], hedgeRatio:0, phase:'brief', result:null, chosen:-1, busted:false};
  if(plan[0].type === 'quiz') plan[0].question = pickGameQuestion();
  app.view = 'game';
  render();
}
function applyHedge(raw){
  if(!game.hedgeRatio) return raw;
  return Math.round(HEDGE_FIXED*game.hedgeRatio + raw*(1 - game.hedgeRatio));
}
function gameChoose(i){
  if(!game || game.phase !== 'brief') return;
  var round = game.plan[game.day];
  if(round.type !== 'market') return;
  var opt = round.scenario.options[i];
  var out = pickOutcome(opt.outcomes);
  var applied = (opt.setsHedge === undefined) ? applyHedge(out.pnl) : out.pnl;
  if(opt.setsHedge !== undefined) game.hedgeRatio = opt.setsHedge;
  game.pnl += applied;
  game.history.push(applied);
  game.chosen = i;
  game.result = {out:out, raw:out.pnl, applied:applied, hedged:(applied !== out.pnl)};
  game.phase = 'result';
  if(game.pnl <= RISK_LIMIT) game.busted = true;
  render();
}
function gameAnswerQuiz(i){
  if(!game || game.phase !== 'brief') return;
  var round = game.plan[game.day];
  if(round.type !== 'quiz') return;
  var q = round.question;
  var ok = (i === q.correct);
  record(q.id, ok);
  var delta = ok ? QUIZ_BONUS : QUIZ_MALUS;
  game.pnl += delta;
  game.history.push(delta);
  game.chosen = i;
  game.result = {quiz:true, ok:ok, delta:delta, q:q};
  game.phase = 'result';
  if(game.pnl <= RISK_LIMIT) game.busted = true;
  render();
}
function gameNext(){
  if(!game) return;
  if(game.busted || game.day >= GAME_LEN - 1){
    game.phase = 'end';
    saveBest();
    render();
    return;
  }
  game.day++;
  game.phase = 'brief';
  game.chosen = -1;
  game.result = null;
  if(game.plan[game.day].type === 'quiz') game.plan[game.day].question = pickGameQuestion();
  render();
}
function gameAction(a){
  if(a === 'start' || a === 'restart'){ gameStart(); return; }
  if(a === 'next'){ gameNext(); return; }
  if(a === 'quit'){ game = null; app.view = 'dashboard'; render(); return; }
}
function gameGrade(pnl){
  if(pnl <= RISK_LIMIT) return {title:'Limites coupées', text:`Le risk management a fermé le book. Ce n'est pas une fin de carrière : relis les débriefs, la plupart des pertes viennent de positions ouvertes non couvertes sur un risque identifiable à l'avance.`};
  if(pnl < 0) return {title:'Mois dans le rouge', text:`Le desk a perdu de l'argent. Regarde quelles journées ont le plus coûté : sur ce jeu, ce sont presque toujours celles où une exposition non couverte rencontre un événement prévisible.`};
  if(pnl < 400) return {title:'Junior analyst', text:`Tu survis, mais tu laisses beaucoup de valeur sur la table. Travaille l'arbitrage entre sécurisation Day-Ahead et exposition Real-Time.`};
  if(pnl < 800) return {title:'Analyst confirmé', text:`Résultat solide. Tu sécurises quand il faut et tu gardes de l'exposition quand l'information le justifie.`};
  if(pnl < 1500) return {title:'Trader', text:`Très bon mois. Tu exploites les asymétries (météo, congestion, rampe) sans exposer le book aux pertes extrêmes.`};
  return {title:'Head of Storage Desk', text:`Performance remarquable — vérifie simplement que la chance n'y est pas pour trop : rejoue une session pour confirmer que la méthode tient.`};
}

    var html = '<div class="hero"><div><h1>'+esc(g.title)+'</h1><p>'+esc(g.text)+'</p></div>'+ring(Math.max(0, Math.min(100, Math.round(100*game.pnl/2000))))+'</div>';
    html += '<div class="summary-stats">' +
      '<div class="stat-box '+(game.pnl>=0?'good':'bad')+'"><div class="stat-num mono">'+fmtK(game.pnl)+'</div><div class="stat-label">P&L final</div></div>' +
      '<div class="stat-box"><div class="stat-num mono">'+wins+' / '+game.history.length+'</div><div class="stat-label">Journées positives</div></div>' +
      '<div class="stat-box"><div class="stat-num mono">'+fmtK(Math.max.apply(null, game.history.concat([0])))+'</div><div class="stat-label">Meilleure journée</div></div>' +
      '<div class="stat-box"><div class="stat-num mono">'+fmtK(Math.min.apply(null, game.history.concat([0])))+'</div><div class="stat-label">Pire journée</div></div>' +
    '</div>';
    if(best) html += '<p class="disclaimer">Meilleur score enregistré sur cet appareil : '+fmtK(best)+'.</p>';
    var due = reviewQueue().length;
    if(due) html += '<p class="disclaimer">'+due+' question'+(due>1?'s':'')+' en attente dans ta file de révision — les erreurs du comité des risques y ont été ajoutées.</p>';
    html += '<div class="actions-row"><button class="btn btn-primary" data-game="restart">Rejouer une session</button>' +
      (due ? '<button class="btn" data-nav="review">Réviser mes erreurs</button>' : '') +
      '<button class="btn btn-ghost" data-nav="dashboard">Retour au dashboard</button></div>';
    return html;
  }

  var round = game.plan[game.day];
  var html = gameHud();

  if(round.type === 'quiz'){
    var q = round.question;
    html += '<div class="card"><span class="quiz-chip">COMITÉ DES RISQUES · '+THEME_BY_KEY[q.theme].ticker+'</span>';
    html += '<p class="qtext" style="margin-top:14px;">'+esc(q.q)+'</p>';
    if(q.scenario) html += '<div class="scenario"><span class="label mono">CONTEXTE</span>'+esc(q.scenario)+'</div>';
    html += '<div class="options">';
    var letters = ['A','B','C','D'];
    q.options.forEach(function(opt, i){
      var cls = 'option';
      if(game.phase === 'result'){
        if(i === q.correct) cls += ' correct';
        else if(i === game.chosen) cls += ' wrong';
        else cls += ' dim';
      }
      html += '<button class="'+cls+'" data-gq="'+i+'"'+(game.phase==='result'?' disabled':'')+'>' +
        '<span class="oletter">'+letters[i]+'</span><span>'+esc(opt)+'</span></button>';
    });
    html += '</div>';
    if(game.phase === 'result'){
      html += '<div class="resolution">' +
        '<div class="pnl-delta '+(game.result.delta>0?'pos':'neg')+'">'+fmtK(game.result.delta)+'</div>' +
        '<p style="margin:6px 0 0;font-size:.9rem;"><strong>'+(game.result.ok?'Bonne réponse.':'Réponse incorrecte — la question rejoint ta file de révision.')+'</strong> '+esc(q.explain)+'</p>' +
      '</div>';
      html += gameFoot();
    }
    html += '</div>';
    return html;
  }

  var sc = round.scenario;
  html += '<div class="card">';
  html += '<span class="quiz-chip">JOUR '+(game.day+1)+' · MARCHÉ</span>';
  html += '<h2 style="margin:12px 0 0;font-size:1.25rem;">'+esc(sc.title)+'</h2>';
  html += '<div class="ctx-grid">' + sc.ctx.map(function(c){
    return '<div class="ctx-item"><span class="k">'+esc(c.k)+'</span><span class="v">'+esc(c.v)+'</span></div>';
  }).join('') + '</div>';
  html += '<p style="font-size:.95rem;margin:0 0 18px;">'+esc(sc.brief)+'</p>';
  html += '<div class="options">';
  sc.options.forEach(function(opt, i){
    var cls = 'choice';
    if(game.phase === 'result') cls += (i === game.chosen ? ' chosen' : ' dim');
    html += '<button class="'+cls+'" data-choice="'+i+'"'+(game.phase==='result'?' disabled':'')+'>' +
      '<span class="ctag">'+esc(opt.tag)+'</span><span class="ctitle">'+esc(opt.label)+'</span></button>';
  });
  html += '</div>';

  if(game.phase === 'result'){
    var r = game.result;
    html += '<div class="resolution">' +
      '<div class="pnl-delta '+(r.applied>=0?'pos':'neg')+'">'+fmtK(r.applied)+'</div>' +
      '<p style="margin:4px 0 8px;font-weight:600;font-family:\'Archivo\',sans-serif;font-size:.94rem;">'+esc(r.out.title)+'</p>' +
      '<p style="margin:0;font-size:.9rem;">'+esc(r.out.text)+'</p>' +
      (r.hedged ? '<p style="margin:8px 0 0;font-size:.85rem;color:var(--teal);">Effet du TB4 swap : résultat de marché '+fmtK(r.raw)+' lissé à '+fmtK(r.applied)+' par la jambe fixe.</p>' : '') +
      '<div class="lesson"><strong>À retenir —</strong> '+esc(sc.lesson)+'</div>' +
    '</div>';
    html += gameFoot();
  }
  html += '</div>';
  return html;
}
function gameFoot(){
  if(game.busted){
    return '<div class="quiz-foot"><button class="btn btn-primary" data-game="next">Voir le bilan (limites coupées)</button></div>';
  }
  var last = game.day >= GAME_LEN - 1;
  return '<div class="quiz-foot"><button class="btn btn-primary" data-game="next">'+(last?'Voir le bilan du mois':'Journée suivante')+'</button></div>';
}

function viewQuiz(){
  var q = session.queue[session.index];
  var n = session.queue.length;
  var pct = Math.round(100*session.index/n);
  var theme = THEME_BY_KEY[q.theme];
  var html = '';
  html += '<div class="quiz-head">' +
    '<span class="quiz-chip">'+theme.ticker+' · '+esc(session.label)+'</span>' +
    '<span class="qcounter mono">Question ' + (session.index+1) + ' / ' + n + '</span>' +
  '</div>';
  html += '<div class="progress-track"><span style="width:'+pct+'%"></span></div>';
  html += '<div class="card">';
  if(q.scenario){
    html += '<div class="scenario"><span class="label mono">SCÉNARIO</span>' + esc(q.scenario) + '</div>';
  }
  html += '<p class="qtext">' + esc(q.q) + '</p>';
  html += '<div class="options" id="optionsWrap">';
  var letters = ['A','B','C','D'];
  q.options.forEach(function(opt, i){
    html += '<button class="option" data-i="'+i+'"><span class="oletter">'+letters[i]+'</span><span>'+esc(opt)+'</span></button>';
  });
  html += '</div>';
  html += '<div id="feedbackWrap"></div>';
  html += '<div class="quiz-foot" id="quizFoot"></div>';
  html += '</div>';
  return html;
}

function viewSummary(){
  var s = session;
  var html = '<div class="hero"><div><h1>Résultats — '+esc(s.label)+'</h1>' +
    '<p>Session terminée. Les questions manquées rejoignent automatiquement votre file de révision.</p></div></div>';
  html += '<div class="summary-stats">' +
    '<div class="stat-box good"><div class="stat-num mono">'+s.correctCount+'</div><div class="stat-label">Correctes</div></div>' +
    '<div class="stat-box bad"><div class="stat-num mono">'+s.wrongCount+'</div><div class="stat-label">Erreurs</div></div>' +
    '<div class="stat-box"><div class="stat-num mono">'+Math.round(100*s.correctCount/(s.correctCount+s.wrongCount||1))+'%</div><div class="stat-label">Score</div></div>' +
  '</div>';
  if(s.missed.length){
    html += '<section class="block"><h2>À revoir</h2>';
    s.missed.forEach(function(m){
      html += '<div class="missed-item"><p class="mq">'+esc(m.q)+'</p><p class="ma">Réponse correcte : '+esc(m.correctText)+'</p></div>';
    });
    html += '</section>';
  } else {
    html += '<div class="empty"><div class="big">100%</div>Sans faute sur cette session.</div>';
  }
  html += '<div class="actions-row">' +
    '<button class="btn btn-primary" data-nav="dashboard">Retour au dashboard</button>' +
    (s.missed.length ? '<button class="btn" data-nav="review">Réviser ces erreurs maintenant</button>' : '') +
  '</div>';
  return html;
}

/* =========================================================
   EVENTS
   ========================================================= */
function goNav(nav){
  if(nav === 'dashboard'){ app.view='dashboard'; render(); return; }
  if(nav === 'reference'){ app.view='reference'; render(); return; }
  if(nav === 'game'){ app.view='game'; render(); return; }
  if(nav === 'review'){
    var q = reviewQueue();
    if(q.length===0){ app.view='dashboard'; render(); flashEmpty(); return; }
    startSession(q, 'Révision des erreurs');
    return;
  }
  if(nav === 'exam'){
    startSession(shuffle(QUESTIONS).slice(0,20), 'Examen blanc');
    return;
  }
  if(nav.indexOf('theme:') === 0){
    var key = nav.slice(6);
    var qs = QUESTIONS.filter(function(q){ return q.theme===key; });
    session = null;
    startSession(qs, THEME_BY_KEY[key].label);
    session.themeKey = key;
    render();
    return;
  }
}

function flashEmpty(){
  var c = document.getElementById('content');
  var note = document.createElement('div');
  note.className = 'empty';
  note.innerHTML = '<div class="big">✓</div>Aucune erreur en attente de révision pour le moment.';
  c.prepend(note);
}

/* One delegated listener: survives every innerHTML rebuild of the rail, HUD and content. */
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest) return;

  var nav = t.closest('[data-nav]');
  if(nav){ goNav(nav.getAttribute('data-nav')); return; }

  if(t.closest('#dueBtn')){ goNav('review'); return; }

  var opt = t.closest('.option');
  if(opt && app.view === 'quiz' && !opt.disabled){
    answerQuestion(parseInt(opt.getAttribute('data-i'), 10));
    return;
  }

  if(t.closest('[data-quiz="next"]')){
    if(session.index >= session.queue.length - 1){ app.view = 'summary'; }
    else { session.index++; session.answered = false; }
    render();
    return;
  }

  var gameEl = t.closest('[data-game]');
  if(gameEl){ gameAction(gameEl.getAttribute('data-game')); return; }

  var choice = t.closest('[data-choice]');
  if(choice && !choice.disabled){ gameChoose(parseInt(choice.getAttribute('data-choice'), 10)); return; }

  var gq = t.closest('[data-gq]');
  if(gq && !gq.disabled){ gameAnswerQuiz(parseInt(gq.getAttribute('data-gq'), 10)); return; }

  if(t.closest('#resetBtn')){
    if(confirm('Réinitialiser toute votre progression et votre historique de révision ?')){
      progress = {};
      saveProgress();
      app.view = 'dashboard';
      session = null;
      game = null;
      render();
    }
    return;
  }
});

function answerQuestion(i){
  if(session.answered) return;
  session.answered = true;
  var q = session.queue[session.index];
  var ok = (i === q.correct);
  record(q.id, ok);
  if(ok){ session.correctCount++; } else {
    session.wrongCount++;
    session.missed.push({q:q.q, correctText:q.options[q.correct]});
  }

  var opts = document.querySelectorAll('.option');
  opts.forEach(function(btn, idx){
    btn.disabled = true;
    if(idx === q.correct) btn.classList.add('correct');
    else if(idx === i) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  var fb = document.getElementById('feedbackWrap');
  fb.innerHTML = '<div class="feedback '+(ok?'ok':'ko')+'">' +
    '<p class="ftitle">'+(ok?'Correct.':'Pas tout à fait.')+'</p>' +
    '<p>'+esc(q.explain)+'</p>' +
  '</div>';

  var isLast = session.index >= session.queue.length - 1;
  var foot = document.getElementById('quizFoot');
  foot.innerHTML = '<button class="btn btn-primary" data-quiz="next">'+(isLast?'Voir les résultats':'Question suivante')+'</button>';

  renderTopStats();
  renderRail();
}

render();
})();
</script>
