/* =========================================================
   MOTEUR SYSTÈME — construit la journée, puis le P&L par actif
   ========================================================= */
var SYS_LEN = 8;
var SYS_RISK_LIMIT = -600;
var SYS_BEST_KEY = 'battery-desk-drill-sysbest-v1';
var sys = null;

function getSysBest(){
  try{ return parseInt(localStorage.getItem(SYS_BEST_KEY) || '0', 10) || 0; }catch(e){ return 0; }
}
function saveSysBest(){
  try{ if(sys && sys.pnl > getSysBest()) localStorage.setItem(SYS_BEST_KEY, String(sys.pnl)); }catch(e){}
}

/* Construit les 24 heures du système pour un état du monde donné. */
function buildDay(sc, real){
  var m = (real && real.mod) || {};
  var pr = sc.profile;
  var gas = m.gas !== undefined ? m.gas : sc.gas;
  var gasSpot = m.gasSpot !== undefined ? m.gasSpot : gas;  /* ton coût livré */
  var windScale = m.windScale || 1, solarScale = m.solarScale || 1, loadScale = m.loadScale || 1;
  var d = {gas:gas, gasSpot:gasSpot, load:[], windCF:[], solarCF:[], windGW:[], solarGW:[], residual:[], price:[]};
  /* Parc ERCOT (GW installés, ordres de grandeur 2026) */
  var FLEET_WIND = 42, FLEET_SOLAR = 32;
  for(var h=0; h<24; h++){
    var load = loadShape(h, pr.base, pr.peak, pr.peakH, pr.morning) * loadScale;
    var wcf = Math.min(0.98, windShape(h, pr.windNight, pr.windDay, pr.windPeakH) * windScale);
    var scf = Math.min(1, solarShape(h, pr.solarPeak) * solarScale);
    var wgw = FLEET_WIND * wcf, sgw = FLEET_SOLAR * scf;
    var res = load - wgw - sgw;
    d.load.push(Math.round(load*10)/10);
    d.windCF.push(wcf); d.solarCF.push(scf);
    d.windGW.push(Math.round(wgw*10)/10); d.solarGW.push(Math.round(sgw*10)/10);
    d.residual.push(Math.round(Math.max(0,res)*10)/10);
    d.price.push(priceFromResidual(res, gas));
  }
  return d;
}

/* Optimiseur simple de la batterie : n cycles sur les meilleures fenêtres. */
function bessPnl(price, cycles, optional){
  var idx = price.map(function(p,h){ return {p:p,h:h}; });
  var sorted = idx.slice().sort(function(a,b){ return a.p - b.p; });
  var total = 0, windows = {charge:[], discharge:[]};
  for(var c=0; c<cycles; c++){
    var low = sorted.slice(c*4, c*4+4), high = sorted.slice(sorted.length - (c+1)*4, sorted.length - c*4);
    if(low.length < 4 || high.length < 4) break;
    var rev = 0, cost = 0;
    high.forEach(function(x){ rev += x.p * 0.1; });
    low.forEach(function(x){ cost += x.p * 0.115; });
    var margin = rev - cost - (c > 0 ? CYCLE_COST : 0);
    if(c > 0 && optional && margin <= 0) break;   /* règle du cycle marginal */
    total += margin;
    if(c === 0){
      windows.charge = low.map(function(x){return x.h;}).sort(function(a,b){return a-b;});
      windows.discharge = high.map(function(x){return x.h;}).sort(function(a,b){return a-b;});
    }
  }
  return {pnl: total, windows: windows};
}

/* P&L par actif, en k$ pour la journée. */
function portfolioPnl(sc, day, effect, book, dayDA){
  effect = effect || {}; book = book || {};
  var price = day.price, h;
  var out = {assets:[], total:0, detail:{}};

  /* --- CCGT : spark spread horaire --- */
  var ccgt = PORTFOLIO[0];
  var gasCost = (effect.gasHedge || book.gasHedge || day.gasSpot || day.gas) * ccgt.hr + ccgt.vom;
  var ccgtPnl = 0, runHours = 0, sparkSum = 0;
  if(effect.mustRunHours){
    /* Engagement Day-Ahead : l'unité tourne quoi qu'il arrive, spark négatif compris. */
    var ranked = price.map(function(p,i){ return {p:p,h:i}; }).sort(function(a,b){ return b.p - a.p; })
                      .slice(0, effect.mustRunHours);
    ranked.forEach(function(x){
      var sp = x.p - gasCost;
      ccgtPnl += sp * ccgt.mw / 1000; runHours++; sparkSum += sp;
    });
  } else {
    for(h=0; h<24; h++){
      var spark = price[h] - gasCost;
      if(spark > 0){ ccgtPnl += spark * ccgt.mw / 1000; runHours++; sparkSum += spark; }
    }
  }
  if(effect.ccgtOff) ccgtPnl = 0;
  if(effect.ccgtDA && dayDA){
    /* Réglé sur la courbe Day-Ahead : pas de prime de rareté temps réel. */
    ccgtPnl = 0; runHours = 0; sparkSum = 0;
    for(h=0; h<24; h++){
      var sparkDA = dayDA.price[h] - gasCost;
      if(sparkDA > 0){ ccgtPnl += sparkDA * ccgt.mw / 1000; runHours++; sparkSum += sparkDA; }
    }
  }
  if(effect.ccgtPush) ccgtPnl *= 1.08;
  var tollRatio = (effect.sign === 'tollCCGT') ? (effect.ratio || 1) : (book.tollCCGT ? book.tollRatio : 0);
  var tollFee = (effect.sign === 'tollCCGT') ? effect.fee : book.tollFee;
  var ccgtMerchant = ccgtPnl;
  if(tollRatio) ccgtPnl = ccgtPnl*(1-tollRatio) + tollFee*tollRatio;
  out.detail.ccgt = {merchant:ccgtMerchant, runHours:runHours, gasCost:gasCost,
                     avgSpark: runHours ? sparkSum/runHours : 0};

  /* --- Éolien : volume × prix, prix de capture --- */
  var wind = PORTFOLIO[1], wVol = 0, wRev = 0;
  var ptc = effect.ptc || 0;   /* crédit d'impôt production, $/MWh */
  for(h=0; h<24; h++){
    var mwh = wind.mw * day.windCF[h];
    if(effect.curtailWind && (price[h] + ptc) < 0) continue;  /* on s'arrête sous le plancher PTC */
    wVol += mwh; wRev += mwh * (price[h] + ptc) / 1000;
  }
  var capture = wVol ? (wRev*1000/wVol) : 0;
  var windMerchant = wRev;
  var ppaRatio = (effect.sign === 'ppaWind') ? (effect.ratio || 1) : (book.ppaWind ? book.ppaRatio : 0);
  var strike = (effect.sign === 'ppaWind') ? effect.strike : book.ppaStrike;
  if(ppaRatio) wRev = wRev*(1-ppaRatio) + (strike * wVol / 1000) * ppaRatio;
  out.detail.wind = {merchant:windMerchant, volume:wVol, capture:capture};

  /* --- Solaire --- */
  var solar = PORTFOLIO[2], sVol = 0, sRev = 0;
  for(h=0; h<24; h++){
    var smwh = solar.mw * day.solarCF[h];
    sVol += smwh; sRev += smwh * price[h] / 1000;
  }
  var sCapture = sVol ? (sRev*1000/sVol) : 0;
  /* Vendu en Day-Ahead sur la prévision : le volume manquant se rachète au marché. */
  if(effect.solarBuyback){
    var deficit = sVol * 0.4;                       /* 40% du volume prévu manque */
    var midday = (price[12] + price[13] + price[14])/3;
    var peakP = Math.max.apply(null, price.slice(14, 21));
    var buyPrice = (effect.solarBuyback === 'early') ? midday * 1.15 : peakP;
    sRev -= deficit * buyPrice / 1000;
    out.detail.solarDeficit = {mwh:deficit, price:buyPrice};
  }
  out.detail.solar = {volume:sVol, capture:sCapture};

  /* --- Batterie --- */
  var cycles = effect.bessCycles || (effect.bessAggressive ? 2 : 1);
  var b = bessPnl(price, cycles, !effect.bessCycles);
  var bPnl = b.pnl;
  if(book.bessSwap) bPnl = HEDGE_FIXED;
  out.detail.bess = {windows:b.windows, cycles:cycles};

  out.assets = [
    {id:'ccgt', name:'CCGT', pnl:Math.round(ccgtPnl)},
    {id:'wind', name:'Éolien', pnl:Math.round(wRev)},
    {id:'solar', name:'Solaire', pnl:Math.round(sRev)},
    {id:'bess', name:'Batterie', pnl:Math.round(bPnl)}
  ];
  if(effect.payoff) out.assets.push({id:'other', name:'Décision', pnl:effect.payoff});
  out.total = out.assets.reduce(function(s,a){ return s + a.pnl; }, 0);
  return out;
}

function sysOptionPnl(sc, opt, real, book){
  var day = buildDay(sc, real);
  if(opt.payoffs !== undefined){
    /* Journées de décision pure (provisions, politique) : la valeur est
       l'effet de la décision, pas le P&L d'exploitation du jour. */
    return opt.payoffs[real.id];
  }
  return portfolioPnl(sc, day, opt.effect || {}, book, buildDay(sc, {mod:{}})).total;
}
function sysOptionEV(sc, opt, book){
  var ev = 0;
  sc.realizations.forEach(function(r){ ev += r.p * sysOptionPnl(sc, opt, r, book); });
  return Math.round(ev);
}
function sysPickReal(sc){
  var r = Math.random(), acc = 0;
  for(var i=0;i<sc.realizations.length;i++){
    acc += sc.realizations[i].p;
    if(r <= acc) return sc.realizations[i];
  }
  return sc.realizations[sc.realizations.length-1];
}

function sysStart(){
  sys = {order: shuffle(SYS_SCENARIOS.slice()), day:0, pnl:0, history:[], book:{},
         phase:'brief', chosen:-1, result:null, goodCalls:0, rounds:0, busted:false,
         ledger:{ppaWind:0, tollCCGT:0, gasHedge:0}};
  /* On garde une progression pédagogique : saisons dans l'ordre, décisions ensuite. */
  sys.order = SYS_SCENARIOS.slice();
  app.view = 'system';
  render();
}
function sysChoose(i){
  if(!sys || sys.phase !== 'brief') return;
  var sc = sys.order[sys.day];
  var real = sysPickReal(sc);
  var book = sys.book;
  var table = sc.options.map(function(o,k){
    return {i:k, label:o.label, tag:o.tag, why:o.why,
            ev: sysOptionEV(sc, o, book), real: sysOptionPnl(sc, o, real, book)};
  });
  var bestEv = table.slice().sort(function(a,b){ return b.ev - a.ev; })[0];
  var chosen = sc.options[i];
  var day = buildDay(sc, real);
  var dayDA = buildDay(sc, {mod:{}});
  var breakdown = chosen.payoffs !== undefined ? null : portfolioPnl(sc, day, chosen.effect || {}, book, dayDA);
  var unhedged = chosen.payoffs !== undefined ? null : portfolioPnl(sc, day, {}, {}, dayDA);
  var applied = table[i].real;

  /* Effets persistants sur le book de couvertures */
  var eff = chosen.effect || {};
  if(eff.sign === 'ppaWind'){ book.ppaWind = true; book.ppaStrike = eff.strike; book.ppaRatio = eff.ratio || 1; }
  if(eff.sign === 'tollCCGT'){ book.tollCCGT = true; book.tollFee = eff.fee; book.tollRatio = eff.ratio || 1; }
  if(eff.gasHedge){ book.gasHedgeUsed = true; }
  /* Ce que les couvertures déjà en place ont coûté ou rapporté aujourd'hui */
  if(breakdown && unhedged){
    if(book.ppaWind) sys.ledger.ppaWind += (breakdown.assets[1].pnl - unhedged.assets[1].pnl);
    if(book.tollCCGT) sys.ledger.tollCCGT += (breakdown.assets[0].pnl - unhedged.assets[0].pnl);
  }

  sys.pnl += applied;
  sys.history.push(applied);
  sys.chosen = i;
  var optimal = (i === bestEv.i);
  if(!sc.noVerdict){ sys.rounds++; if(optimal) sys.goodCalls++; }
  sys.result = {real:real, day:day, table:table, bestEv:bestEv, applied:applied,
                optimal:optimal, breakdown:breakdown, unhedged:unhedged, opt:chosen};
  sys.phase = 'result';
  if(sys.pnl <= SYS_RISK_LIMIT) sys.busted = true;
  render();
}
function sysNext(){
  if(!sys) return;
  if(sys.busted || sys.day >= SYS_LEN - 1){ sys.phase = 'end'; saveSysBest(); render(); return; }
  sys.day++; sys.phase = 'brief'; sys.chosen = -1; sys.result = null;
  render();
}
function sysAction(a){
  if(a === 'start' || a === 'restart'){ sysStart(); return; }
  if(a === 'next'){ sysNext(); return; }
}

/* =========================================================
   GAME ENGINE — PnL Maker
   Principe : aucun gain n'est tiré au sort. Le hasard porte
   UNIQUEMENT sur l'état du monde (la courbe Real-Time réalisée) ;
   le P&L de chaque option est ensuite CALCULÉ sur cette courbe.
   On peut donc afficher, après coup, ce qu'auraient rapporté
   toutes les options — et l'espérance de chacune ex ante.
   ========================================================= */
var GAME_LEN = 10;
var RISK_LIMIT = -400;
var HEDGE_FIXED = 95;
var QUIZ_BONUS = 80;
var QUIZ_MALUS = -60;
var CYCLE_COST = 18;
var BEST_KEY = 'battery-desk-drill-best-v1';
var game = null;

function getBest(){
  try{ return parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; }catch(e){ return 0; }
}
function saveBest(){
  try{ if(game && game.pnl > getBest()) localStorage.setItem(BEST_KEY, String(game.pnl)); }catch(e){}
}

/* --- P&L d'une option, sur un état du monde donné --- */
function optionPnl(opt, sc, real){
  if(opt.payoffs) return opt.payoffs[real.id];
  if(opt.fixed !== undefined) return opt.fixed;

  var da = sc.da, rt = real.rtCurve;
  var plan = opt.plan;
  var priceAt = function(h){
    if(plan.settle === 'DA') return da[h];
    if(plan.settle === 'MIX') return (da[h] + rt[h]) / 2;
    return rt[h];
  };
  /* Le nœud (basis) : sur ces scénarios, rt EST le prix du nœud. */
  var rev = 0, cost = 0, i;
  var dis = (plan.discharge || []), chg = (plan.charge || []);
  for(i=0;i<dis.length;i++) rev += priceAt(dis[i]) * BAT.dischargeK;
  for(i=0;i<chg.length;i++) cost += priceAt(chg[i]) * BAT.chargeK;
  if(plan.discharge2) for(i=0;i<plan.discharge2.length;i++) rev += priceAt(plan.discharge2[i]) * BAT.dischargeK;
  if(plan.charge2) for(i=0;i<plan.charge2.length;i++) cost += priceAt(plan.charge2[i]) * BAT.chargeK;

  var pnl = rev - cost;
  if(plan.cycles) pnl -= CYCLE_COST * plan.cycles;
  if(opt.bonus) pnl += opt.bonus;
  if(opt.crr){
    /* Le CRR paie l'écart nœud-hub sur les heures de décharge, moins sa prime. */
    var payout = 0;
    for(i=0;i<dis.length;i++) payout += Math.max(0, da[dis[i]] - rt[dis[i]]) * BAT.dischargeK;
    pnl += payout - opt.crr;
  } else if(opt.basisUnhedged && plan.settle === 'RT'){
    /* Le swap se règle contre le hub (da) : l'écart hub-nœud est à ta charge. */
    var basis = 0;
    for(i=0;i<dis.length;i++) basis += (da[dis[i]] - rt[dis[i]]) * BAT.dischargeK;
    pnl -= basis;
  }
  if(real.derate && (opt.derateSensitive)) pnl = pnl * 0.15 - 120;
  return Math.round(pnl);
}

/* --- Espérance d'une option sur tous les états du monde --- */
function optionEV(opt, sc){
  var ev = 0;
  sc.realizations.forEach(function(r){ ev += r.p * optionPnl(opt, sc, r); });
  return Math.round(ev);
}

/* --- Benchmark TB4 : les 4 heures les plus chères moins les 4 moins chères --- */
function tbx(curve, n){
  var idx = curve.map(function(p,h){ return {p:p, h:h}; });
  var sorted = idx.slice().sort(function(a,b){ return a.p - b.p; });
  var low = sorted.slice(0, n), high = sorted.slice(-n);
  var pnl = 0;
  high.forEach(function(x){ pnl += x.p * BAT.dischargeK; });
  low.forEach(function(x){ pnl -= x.p * BAT.chargeK; });
  return {
    pnl: Math.round(pnl),
    charge: low.map(function(x){ return x.h; }).sort(function(a,b){ return a-b; }),
    discharge: high.map(function(x){ return x.h; }).sort(function(a,b){ return a-b; })
  };
}

function prepareScenario(sc){
  sc.realizations.forEach(function(r){
    if(!r.rtCurve) r.rtCurve = makeRT(sc.da, r.rt || {type:'same', seed:r.seed});
  });
  return sc;
}
function pickRealization(sc){
  var r = Math.random(), acc = 0;
  for(var i=0;i<sc.realizations.length;i++){
    acc += sc.realizations[i].p;
    if(r <= acc) return sc.realizations[i];
  }
  return sc.realizations[sc.realizations.length-1];
}
function pickGameQuestion(){
  var due = reviewQueue();
  var pool = due.length ? due : QUESTIONS.filter(function(q){ return !entry(q.id).attempted; });
  if(!pool.length) pool = QUESTIONS;
  return shuffle(pool)[0];
}

function gameStart(){
  var pool = shuffle(GAME_SCENARIOS), si = 0, plan = [];
  for(var d=1; d<=GAME_LEN; d++){
    if(d % 4 === 0) plan.push({type:'quiz'});
    else plan.push({type:'market', scenario: prepareScenario(pool[si++ % pool.length])});
  }
  game = {plan:plan, day:0, pnl:0, history:[], hedgeRatio:0, phase:'brief',
          result:null, chosen:-1, busted:false, goodCalls:0, marketRounds:0};
  if(plan[0].type === 'quiz') plan[0].question = pickGameQuestion();
  app.view = 'game';
  render();
}
function applyHedge(raw){
  if(!game.hedgeRatio) return raw;
  return Math.round(HEDGE_FIXED*game.hedgeRatio + raw*(1 - game.hedgeRatio));
}

function gameChoose(i){
  if(!game || game.phase !== 'brief') return;
  var round = game.plan[game.day];
  if(round.type !== 'market') return;
  var sc = round.scenario;
  var real = pickRealization(sc);
  var chosen = sc.options[i];

  /* Toutes les options, évaluées ex ante (EV) et sur l'état du monde tiré. */
  var table = sc.options.map(function(o, k){
    return {i:k, label:o.label, tag:o.tag, why:o.why, ev:optionEV(o, sc), real:optionPnl(o, sc, real)};
  });
  var bestEv = table.slice().sort(function(a,b){ return b.ev - a.ev; })[0];
  var bestReal = table.slice().sort(function(a,b){ return b.real - a.real; })[0];

  var raw = table[i].real;
  var applied = (chosen.setsHedge === undefined) ? applyHedge(raw) : raw;
  if(chosen.setsHedge !== undefined) game.hedgeRatio = chosen.setsHedge;

  game.pnl += applied;
  game.history.push(applied);
  game.chosen = i;
  /* Les journées d'arbitrage risque/rendement (ex. signer un swap) n'ont pas de
     "bonne" réponse en espérance : elles ne comptent pas dans le score de décision. */
  var optimal = (i === bestEv.i);
  if(!sc.noVerdict){
    game.marketRounds++;
    if(optimal) game.goodCalls++;
  }

  game.result = {
    real:real, table:table, bestEv:bestEv, bestReal:bestReal,
    raw:raw, applied:applied, hedged:(applied !== raw), optimal:optimal,
    tb:tbx(real.rtCurve, BAT.hours), plan:chosen.plan || null, opt:chosen
  };
  game.phase = 'result';
  if(game.pnl <= RISK_LIMIT) game.busted = true;
  render();
}

function gameAnswerQuiz(i){
  if(!game || game.phase !== 'brief') return;
  var round = game.plan[game.day];
  if(round.type !== 'quiz') return;
  var q = round.question;
  var ok = (i === q.correct);
  record(q.id, ok);
  var delta = ok ? QUIZ_BONUS : QUIZ_MALUS;
  game.pnl += delta;
  game.history.push(delta);
  game.chosen = i;
  game.result = {quiz:true, ok:ok, delta:delta, q:q};
  game.phase = 'result';
  if(game.pnl <= RISK_LIMIT) game.busted = true;
  render();
}
function gameNext(){
  if(!game) return;
  if(game.busted || game.day >= GAME_LEN - 1){
    game.phase = 'end'; saveBest(); render(); return;
  }
  game.day++;
  game.phase = 'brief';
  game.chosen = -1;
  game.result = null;
  if(game.plan[game.day].type === 'quiz') game.plan[game.day].question = pickGameQuestion();
  render();
}
function gameAction(a){
  if(a === 'start' || a === 'restart'){ gameStart(); return; }
  if(a === 'next'){ gameNext(); return; }
}
function gameGrade(pnl, calls, rounds){
  var rate = rounds ? Math.round(100*calls/rounds) : 0;
  if(pnl <= RISK_LIMIT) return {title:'Limites coupées', text:`Le risk management a fermé le book. Regarde la colonne « espérance » des débriefs : les pertes viennent presque toujours d'options dont l'EV était déjà négative avant le tirage.`};
  if(rate >= 80) return {title:'Décisions de Head of Desk', text:`${rate}% de décisions optimales ex ante — c'est le seul chiffre qui mesure vraiment ta compétence ici. Le P&L, lui, dépend aussi des tirages.`};
  if(rate >= 60) return {title:'Trader confirmé', text:`${rate}% de décisions optimales. Solide : tu identifies la bonne option la plupart du temps. Les débriefs des rounds manqués pointent ce qu'il reste à travailler.`};
  if(rate >= 40) return {title:'Analyst en progression', text:`${rate}% de décisions optimales. Tu vois les bonnes fenêtres mais tu arbitres encore mal entre couverture et exposition — relis les colonnes d'espérance.`};
  return {title:'Junior analyst', text:`${rate}% de décisions optimales. Prends le temps de lire la courbe avant de choisir : la fenêtre de charge la moins chère et la fenêtre de décharge la plus chère se voient à l'œil nu.`};
}


/* =========================================================
   RENDER
   ========================================================= */
function render(){
  renderTopStats();
  renderRail();
  var c = document.getElementById('content');
  if(app.view === 'dashboard') c.innerHTML = viewDashboard();
  else if(app.view === 'reference') c.innerHTML = viewReference();

/* ---------------------------------------------------------
   Courbe de prix 24h — SVG inline, deux séries max (une seule
   avant résolution), bandes de charge/décharge annotées.
   --------------------------------------------------------- */
function priceChart(sc, opts){
  opts = opts || {};
  var da = sc.da, rt = opts.rt || null, plan = opts.plan || null, tb = opts.tb || null;
  var W = 720, H = 210, padL = 46, padR = 12, padT = 16, padB = 26;
  var iw = W - padL - padR, ih = H - padT - padB;
  var all = da.concat(rt || []);
  var max = Math.max.apply(null, all), min = Math.min.apply(null, all);
  max = Math.max(max, 10); min = Math.min(min, 0);
  var pad = (max - min) * 0.08;
  var hi = max + pad, lo = min - pad;
  var x = function(h){ return padL + (h/23)*iw; };
  var y = function(p){ return padT + ih - ((p - lo)/(hi - lo))*ih; };
  var line = function(arr){
    return arr.map(function(p,h){ return (h?'L':'M') + x(h).toFixed(1) + ' ' + y(p).toFixed(1); }).join(' ');
  };
  var band = function(hours, cls, label){
    if(!hours || !hours.length) return '';
    var h0 = Math.min.apply(null, hours), h1 = Math.max.apply(null, hours);
    var bx = x(h0) - (iw/23)/2, bw = x(h1) - x(h0) + (iw/23);
    bx = Math.max(padL, bx); bw = Math.min(bw, padL + iw - bx);
    return '<rect class="'+cls+'" x="'+bx.toFixed(1)+'" y="'+padT+'" width="'+bw.toFixed(1)+'" height="'+ih+'" rx="3"/>' +
      '<text class="band-label" x="'+(bx+bw/2).toFixed(1)+'" y="'+(padT+11)+'" text-anchor="middle">'+label+'</text>';
  };
  var ticks = [], i;
  for(i=0;i<4;i++){
    var v = lo + (hi-lo)*i/3;
    ticks.push('<line class="viz-grid" x1="'+padL+'" y1="'+y(v).toFixed(1)+'" x2="'+(padL+iw)+'" y2="'+y(v).toFixed(1)+'"/>' +
      '<text class="viz-axis" x="'+(padL-6)+'" y="'+(y(v)+3.5).toFixed(1)+'" text-anchor="end">'+Math.round(v)+'</text>');
  }
  var hlabels = [0,4,8,12,16,20,23].map(function(h){
    return '<text class="viz-axis" x="'+x(h).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+h+'h</text>';
  }).join('');

  var svg = '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" role="img" preserveAspectRatio="none" ' +
      'aria-label="Courbe de prix horaire sur 24 heures">';
  svg += ticks.join('');
  if(plan){
    svg += band(plan.charge, 'band-charge', 'CHARGE');
    svg += band(plan.discharge, 'band-discharge', 'DÉCHARGE');
    if(plan.charge2) svg += band(plan.charge2, 'band-charge', 'CHARGE 2');
    if(plan.discharge2) svg += band(plan.discharge2, 'band-discharge', 'DÉCHARGE 2');
  }
  if(tb){
    [].concat(tb.charge).forEach(function(h){
      svg += '<rect class="tb-mark" x="'+(x(h)-4).toFixed(1)+'" y="'+(padT+ih+2)+'" width="8" height="3" rx="1.5"/>';
    });
    [].concat(tb.discharge).forEach(function(h){
      svg += '<rect class="tb-mark hi" x="'+(x(h)-4).toFixed(1)+'" y="'+(padT+ih+2)+'" width="8" height="3" rx="1.5"/>';
    });
  }
  svg += '<path class="line-da'+(rt?' muted':'')+'" d="'+line(da)+'"/>';
  if(rt) svg += '<path class="line-rt" d="'+line(rt)+'"/>';
  svg += hlabels;
  svg += '<rect class="chart-hit" x="'+padL+'" y="'+padT+'" width="'+iw+'" height="'+ih+'" fill="transparent"/>';
  svg += '</svg>';

  var legend = '<div class="viz-legend">' +
    '<span class="lg"><i class="sw-line'+(rt?' muted':'')+'"></i>' + esc((sc.seriesLabels && sc.seriesLabels.da) || 'Prix Day-Ahead') + '</span>' +
    (rt ? '<span class="lg"><i class="sw-line rt"></i>' + esc((sc.seriesLabels && sc.seriesLabels.rt) || 'Prix Real-Time réalisé') + '</span>' : '') +
    (plan ? '<span class="lg"><i class="sw-band charge"></i>Ta charge</span><span class="lg"><i class="sw-band discharge"></i>Ta décharge</span>' : '') +
    (tb ? '<span class="lg"><i class="sw-tb"></i>Fenêtres TB4 optimales</span>' : '') +
  '</div>';

  var data = JSON.stringify({da:da, rt:rt, labels:[(sc.seriesLabels&&sc.seriesLabels.da)||'DA', (sc.seriesLabels&&sc.seriesLabels.rt)||'RT']});
  return '<figure class="chart" data-chart=\''+data.replace(/'/g,'&#39;')+'\'>' +
    '<figcaption class="chart-title">'+(opts.title || 'Prix horaires — $/MWh')+'</figcaption>' +
    svg + legend + '<div class="chart-tip" hidden></div></figure>';
}

/* SOC sur 24h, graphique séparé (jamais un second axe sur le même cadre). */
function socChart(plan){
  if(!plan) return '';
  var chg = {}, dis = {}, h;
  (plan.charge||[]).concat(plan.charge2||[]).forEach(function(x){ chg[x]=1; });
  (plan.discharge||[]).concat(plan.discharge2||[]).forEach(function(x){ dis[x]=1; });
  /* Point de départ cohérent avec le plan : on part d'un SOC qui permet
     exactement la charge prévue (chaque heure de charge = +25% de 400 MWh). */
  var nChg = Object.keys(chg).length;
  var start = plan.soc !== undefined ? (plan.soc/400*100) : (nChg ? Math.max(0, 100 - 25*nChg) : 100);
  var soc = [], cur = start;
  for(h=0;h<24;h++){
    if(chg[h]) cur = Math.min(100, cur + 25);
    else if(dis[h]) cur = Math.max(0, cur - 25);
    soc.push(cur);
  }
  var W = 720, H = 74, padL = 46, padR = 12, padT = 12, padB = 14;
  var iw = W - padL - padR, ih = H - padT - padB;
  var x = function(h){ return padL + (h/23)*iw; };
  var y = function(v){ return padT + ih - (v/100)*ih; };
  var path = soc.map(function(v,h){ return (h?'L':'M') + x(h).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' ');
  var area = path + ' L ' + x(23).toFixed(1) + ' ' + (padT+ih) + ' L ' + x(0).toFixed(1) + ' ' + (padT+ih) + ' Z';
  return '<figure class="chart soc"><figcaption class="chart-title">État de charge (SOC) — % de 400 MWh</figcaption>' +
    '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="État de charge sur 24 heures">' +
      '<line class="viz-grid" x1="'+padL+'" y1="'+y(100)+'" x2="'+(padL+iw)+'" y2="'+y(100)+'"/>' +
      '<line class="viz-grid" x1="'+padL+'" y1="'+y(0)+'" x2="'+(padL+iw)+'" y2="'+y(0)+'"/>' +
      '<text class="viz-axis" x="'+(padL-6)+'" y="'+(y(100)+3.5)+'" text-anchor="end">100</text>' +
      '<text class="viz-axis" x="'+(padL-6)+'" y="'+(y(0)+3.5)+'" text-anchor="end">0</text>' +
      '<path class="soc-area" d="'+area+'"/><path class="soc-line" d="'+path+'"/>' +
    '</svg></figure>';
}

function gameSpark(){
  if(!game.history.length) return '';
  var max = Math.max.apply(null, game.history.map(function(v){ return Math.abs(v); })) || 1;
  return '<div class="spark">' + game.history.map(function(v){
    var h = Math.max(6, Math.round(100*Math.abs(v)/max));
    return '<span class="'+(v<0?'neg':'')+'" style="height:'+h+'%"></span>';
  }).join('') + '</div>';
}
function gameHud(){
  var riskUsed = game.pnl < 0 ? Math.min(100, Math.round(100*Math.abs(game.pnl)/Math.abs(RISK_LIMIT))) : 0;
  var hedgeTxt = game.hedgeRatio ? (Math.round(game.hedgeRatio*100) + '% couvert (TB4)') : 'Merchant intégral';
  var rate = game.marketRounds ? Math.round(100*game.goodCalls/game.marketRounds) : 0;
  return '<div class="game-hud">' +
    '<div class="hud-box"><span class="hud-label">P&L cumulé</span>' +
      '<div class="hud-value '+(game.pnl>0?'pos':(game.pnl<0?'neg':''))+'">'+fmtK(game.pnl)+'</div>' + gameSpark() + '</div>' +
    '<div class="hud-box"><span class="hud-label">Décisions optimales</span>' +
      '<div class="hud-value">'+game.goodCalls+' / '+game.marketRounds+'</div>' +
      '<span class="hud-sub">'+(game.marketRounds ? rate+'% — le vrai score de compétence' : 'ex ante, hors chance')+'</span></div>' +
    '<div class="hud-box"><span class="hud-label">Journée</span><div class="hud-value">'+(game.day+1)+' / '+GAME_LEN+'</div>' +
      '<span class="hud-sub">'+hedgeTxt+'</span></div>' +
    '<div class="hud-box"><span class="hud-label">Limite de risque</span><div class="hud-value">'+fmtK(RISK_LIMIT)+'</div>' +
      '<div class="risk-meter"><span style="width:'+riskUsed+'%"></span></div></div>' +
  '</div>';
}

function pnlBreakdown(plan, curve, sc){
  if(!plan) return '';
  var dis = (plan.discharge||[]).concat(plan.discharge2||[]);
  var chg = (plan.charge||[]).concat(plan.charge2||[]);
  var priceAt = function(h){
    if(plan.settle === 'DA') return sc.da[h];
    if(plan.settle === 'MIX') return (sc.da[h] + curve[h])/2;
    return curve[h];
  };
  var avgD = dis.length ? dis.reduce(function(s,h){ return s + priceAt(h); }, 0)/dis.length : 0;
  var avgC = chg.length ? chg.reduce(function(s,h){ return s + priceAt(h); }, 0)/chg.length : 0;
  var rev = avgD * dis.length * BAT.dischargeK, cost = avgC * chg.length * BAT.chargeK;
  var rows = '<div class="calc">' +
    '<div><span>Décharge</span><span>'+dis.length+' h × 100 MWh @ '+fmtP(avgD)+'</span><span class="pos">'+fmtK(rev)+'</span></div>' +
    (chg.length ? '<div><span>Charge</span><span>'+chg.length+' h × 115 MWh @ '+fmtP(avgC)+'</span><span class="'+(cost>0?'neg':'pos')+'">'+fmtK(-cost)+'</span></div>' : '') +
    (plan.cycles && plan.cycles > 1 ? '<div><span>Dégradation</span><span>'+plan.cycles+' cycles × '+CYCLE_COST+' k$</span><span class="neg">'+fmtK(-CYCLE_COST*plan.cycles)+'</span></div>' :
      (plan.cycles ? '<div><span>Dégradation</span><span>1 cycle × '+CYCLE_COST+' k$</span><span class="neg">'+fmtK(-CYCLE_COST)+'</span></div>' : '')) +
  '</div>';
  return '<div class="calc-wrap"><span class="calc-head">D\'où vient le chiffre — 115 MWh chargés pour 100 MWh restitués (RTE 87%)</span>'+rows+'</div>';
}

    if(game.phase === 'result'){
      html += '<div class="resolution"><div class="pnl-delta '+(game.result.delta>0?'pos':'neg')+'">'+fmtK(game.result.delta)+'</div>' +
        '<p style="margin:6px 0 0;font-size:.9rem;"><strong>'+(game.result.ok?'Bonne réponse.':'Réponse incorrecte — la question rejoint ta file de révision.')+'</strong> '+esc(q.explain)+'</p></div>' + gameFoot();
    }
    html += '</div>';
    return html;
  }

  /* ---- Journée de marché ---- */
  var sc = round.scenario;
  html += '<div class="card">';
  html += '<span class="quiz-chip">JOUR '+(game.day+1)+' · MARCHÉ</span>';
  html += '<h2 style="margin:12px 0 0;font-size:1.25rem;">'+esc(sc.title)+'</h2>';
  html += '<div class="ctx-grid">' + sc.ctx.map(function(c){
    return '<div class="ctx-item"><span class="k">'+esc(c.k)+'</span><span class="v">'+esc(c.v)+'</span></div>';
  }).join('') + '</div>';

  if(game.phase === 'brief'){
    html += priceChart(sc, {title:'Prix Day-Ahead publiés — $/MWh'});
    html += '<p style="font-size:.95rem;margin:14px 0 18px;">'+esc(sc.brief)+'</p>';
  } else {
    var r = game.result;
    html += priceChart(sc, {rt:r.real.rtCurve, plan:r.plan, tb:r.tb, title:'Ce qui s\'est réellement passé — $/MWh'});
    if(r.plan) html += socChart(r.plan);
  }

  html += '<div class="options">';
  sc.options.forEach(function(opt, i){
    var cls = 'choice';
    if(game.phase === 'result'){
      cls += (i === game.chosen ? ' chosen' : ' dim');
      if(game.result.bestEv && i === game.result.bestEv.i) cls += ' best';
    }
    html += '<button class="'+cls+'" data-choice="'+i+'"'+(game.phase==='result'?' disabled':'')+'>' +
      '<span class="ctag">'+esc(opt.tag)+'</span><span class="ctitle">'+esc(opt.label)+'</span></button>';
  });
  html += '</div>';

  if(game.phase === 'result'){
    var r2 = game.result;
    var capture = r2.tb.pnl > 0 ? Math.round(100*r2.raw/r2.tb.pnl) : null;
    html += '<div class="resolution">';
    html += '<span class="res-label mono">CE QUI S\'EST PASSÉ</span>';
    html += '<p style="margin:4px 0 10px;font-weight:600;font-family:\'Archivo\',sans-serif;font-size:.95rem;">'+esc(r2.real.name)+'</p>';
    html += '<p style="margin:0 0 14px;font-size:.9rem;">'+esc(r2.real.text)+'</p>';
    html += '<div class="pnl-delta '+(r2.applied>=0?'pos':'neg')+'">'+fmtK(r2.applied)+'</div>';
    if(r2.hedged) html += '<p style="margin:4px 0 0;font-size:.85rem;color:var(--teal);">Effet du TB4 swap : '+fmtK(r2.raw)+' de marché lissé à '+fmtK(r2.applied)+' par la jambe fixe.</p>';
    html += pnlBreakdown(r2.plan, r2.real.rtCurve, sc);

    /* Verdict : décision vs résultat */
    if(sc.noVerdict){
      var evSpread = Math.max.apply(null, r2.table.map(function(t){ return t.ev; })) -
                     Math.min.apply(null, r2.table.map(function(t){ return t.ev; }));
      html += '<div class="verdict neutral">' +
        '<p class="vhead">Pas de bonne réponse unique — c\'est un arbitrage risque/rendement</p>' +
        '<p class="vtext">'+esc(r2.opt.why)+'</p>' +
        '<p class="vtext dim">L\'écart d\'espérance entre les trois options n\'est que de '+fmtK(evSpread)+' : ce qui les sépare vraiment, c\'est la variance, pas le rendement moyen. Cette journée ne compte donc pas dans ton score de décisions — sur un desk réel, le choix dépend des covenants de ta dette et de la tolérance au risque de ton actionnaire, pas d\'un calcul d\'espérance.</p>' +
      '</div>';
    } else {
    html += '<div class="verdict '+(r2.optimal?'ok':'ko')+'">';
    if(r2.optimal){
      html += '<p class="vhead">Décision optimale ex ante</p><p class="vtext">'+esc(r2.opt.why)+'</p>';
      if(r2.bestReal.i !== game.chosen){
        html += '<p class="vtext dim">Avec le recul, « '+esc(r2.bestReal.label)+' » aurait rapporté davantage dans cet état du monde ('+fmtK(r2.bestReal.real)+'). Mais l\'information n\'était pas disponible au moment de décider : c\'est de la variance, pas une erreur.</p>';
      }
    } else {
      html += '<p class="vhead">Une meilleure décision existait : « '+esc(r2.bestEv.label)+' »</p>';
      html += '<p class="vtext">'+esc(r2.bestEv.why)+'</p>';
      html += '<p class="vtext dim">Espérance de ton choix '+fmtK(r2.table[game.chosen].ev)+' contre '+fmtK(r2.bestEv.ev)+' — un écart de '+fmtK(r2.bestEv.ev - r2.table[game.chosen].ev)+' par journée de ce type.';
      if(r2.table[game.chosen].real >= r2.bestEv.real) html += ' Ton tirage a été favorable cette fois, ce qui ne valide pas la décision.';
      html += '</p>';
    }
    html += '</div>';
    }

    /* Tableau comparatif des options */
    html += '<div class="table-wrap" style="margin-top:14px;"><table class="cmp opt-table"><thead><tr>' +
      '<th>Option</th><th>Espérance (avant tirage)</th><th>Résultat dans ce monde</th></tr></thead><tbody>';
    r2.table.forEach(function(t){
      var marks = (t.i === game.chosen ? '<span class="tag-you">ton choix</span>' : '') +
                  (t.i === r2.bestEv.i ? '<span class="tag-best">meilleure EV</span>' : '');
      html += '<tr class="'+(t.i===game.chosen?'is-you':'')+'"><td>'+esc(t.label)+' '+marks+'</td>' +
        '<td class="mono '+(t.ev>=0?'pos':'neg')+'">'+fmtK(t.ev)+'</td>' +
        '<td class="mono '+(t.real>=0?'pos':'neg')+'">'+fmtK(t.real)+'</td></tr>';
    });
    html += '</tbody></table></div>';

    /* Le TB4 se calcule sur la courbe réalisée : il n'est comparable qu'à une
       stratégie réglée en Real-Time sur cette même courbe. */
    var benchmarkable = r2.plan && r2.plan.settle === 'RT' && !sc.noBenchmark && capture !== null;
    if(benchmarkable){
      html += '<p class="capture">Benchmark du jour — <strong>TB4 = '+fmtK(r2.tb.pnl)+'</strong> (charge '+r2.tb.charge.map(function(h){return h+'h';}).join(', ')+' · décharge '+r2.tb.discharge.map(function(h){return h+'h';}).join(', ')+'), soit les 4 heures les plus chères moins les 4 moins chères. ' +
        'Ton capture rate : <strong>'+capture+'%</strong> du maximum théorique à prévision parfaite.' +
        (capture > 100 ? ' Au-dessus de 100% : le TB4 ne mesure que l\'arbitrage énergie — ton revenu de réserve s\'y ajoute, ce qui est précisément l\'intérêt du revenue stacking.' : '') + '</p>';
    }
    html += '<div class="lesson"><strong>À retenir —</strong> '+esc(sc.lesson)+'</div>';
    html += '</div>';
    html += gameFoot();
  }
  html += '</div>';
  return html;
}
/* ---------- Carte du Texas : météo par zone + niveau de prix ---------- */
/* Silhouette du Texas : panhandle, frontière nord, Louisiane, côte du Golfe,
   pointe sud de Brownsville, puis le Rio Grande en diagonale jusqu'à El Paso. */
var TEXAS_PATH = 'M26,9 L44,9 L44,24 L56,24 L60,27 L67,26 L73,29 L79,29 ' +
  'L81,41 L77,46 L70,51 L64,58 L59,65 L55,73 L57,82 ' +
  'L50,75 L43,68 L36,60 L30,52 L23,46 L17,39 L12,34 ' +
  'L12,25 L26,25 Z';

function priceTone(p){
  /* Rampe séquentielle à une seule teinte : clair = prix bas, foncé = prix élevé. */
  if(p < 0) return 'neg';
  if(p < 25) return 's1';
  if(p < 45) return 's2';
  if(p < 90) return 's3';
  if(p < 250) return 's4';
  return 's5';
}
function texasMap(sc, day){
  var avg = day ? Math.round(day.price.reduce(function(s,p){ return s+p; },0)/24) : null;
  var peak = day ? Math.max.apply(null, day.price) : null;
  var chips = ZONES.map(function(z){
    var info = (sc.zones && sc.zones[z.id]) || {w:'—', t:'—'};
    /* Le prix nodal réel varie par zone ; on module le prix système par zone. */
    var mod = {panhandle:0.82, west:0.78, north:1.0, houston:1.12, south:0.95}[z.id] || 1;
    var zp = day ? Math.round(avg * mod) : null;
    var tone = zp === null ? 's2' : priceTone(zp);
    var assets = PORTFOLIO.filter(function(a){ return a.zone === z.id; });
    return '<g class="zone">' +
      '<circle class="zone-dot tone-'+tone+'" cx="'+z.x+'" cy="'+z.y+'" r="3.4"/>' +
      '<text class="zone-name" x="'+(z.x+5)+'" y="'+(z.y-1)+'">'+esc(z.name)+'</text>' +
      '<text class="zone-meta" x="'+(z.x+5)+'" y="'+(z.y+3.6)+'">'+esc(info.w)+' · '+esc(info.t)+
        (zp !== null ? ' · '+zp+' $' : '')+'</text>' +
      (assets.length ? '<text class="zone-asset" x="'+(z.x+5)+'" y="'+(z.y+8)+'">◆ '+
        assets.map(function(a){ return esc(a.short); }).join(' + ')+'</text>' : '') +
    '</g>';
  }).join('');

  return '<figure class="chart map"><figcaption class="chart-title">Texas — météo par zone et niveau de prix' +
      (avg !== null ? ' (moyenne système '+avg+' $/MWh, pointe '+peak+' $)' : '') + '</figcaption>' +
    '<svg class="chart-svg map-svg" viewBox="0 0 116 100" role="img" aria-label="Carte du Texas par zone">' +
      '<path class="tx-outline" d="'+TEXAS_PATH+'"/>' + chips +
    '</svg>' +
    '<div class="viz-legend">' +
      '<span class="lg"><i class="sw-dot tone-s1"></i>prix bas</span>' +
      '<span class="lg"><i class="sw-dot tone-s3"></i>moyen</span>' +
      '<span class="lg"><i class="sw-dot tone-s5"></i>rareté</span>' +
      '<span class="lg">◆ tes actifs</span>' +
    '</div></figure>';
}

/* ---------- Pile de production : d'où vient le prix ---------- */
function stackChart(day){
  var W = 720, H = 220, padL = 40, padR = 12, padT = 16, padB = 26;
  var iw = W-padL-padR, ih = H-padT-padB;
  var maxY = Math.max.apply(null, day.load.concat([1])) * 1.12;
  var x = function(h){ return padL + (h/23)*iw; };
  var y = function(v){ return padT + ih - (v/maxY)*ih; };
  var series = [
    {key:'windGW', cls:'f-wind', label:'Éolien'},
    {key:'solarGW', cls:'f-solar', label:'Solaire'},
    {key:'residual', cls:'f-gas', label:'Gaz & pilotable (résiduel)'}
  ];
  var base = new Array(24).fill(0), paths = '';
  series.forEach(function(s){
    var top = day[s.key].map(function(v,h){ return base[h] + v; });
    var d = 'M ' + x(0) + ' ' + y(base[0]);
    for(var h=0; h<24; h++) d += ' L ' + x(h).toFixed(1) + ' ' + y(top[h]).toFixed(1);
    for(var h2=23; h2>=0; h2--) d += ' L ' + x(h2).toFixed(1) + ' ' + y(base[h2]).toFixed(1);
    paths += '<path class="stack '+s.cls+'" d="'+d+' Z"/>';
    base = top;
  });
  var loadPath = day.load.map(function(v,h){ return (h?'L':'M')+x(h).toFixed(1)+' '+y(v).toFixed(1); }).join(' ');
  var grid = '';
  for(var g=0; g<=3; g++){
    var gv = maxY*g/3;
    grid += '<line class="viz-grid" x1="'+padL+'" y1="'+y(gv).toFixed(1)+'" x2="'+(padL+iw)+'" y2="'+y(gv).toFixed(1)+'"/>' +
      '<text class="viz-axis" x="'+(padL-6)+'" y="'+(y(gv)+3.5).toFixed(1)+'" text-anchor="end">'+Math.round(gv)+'</text>';
  }
  var hl = [0,4,8,12,16,20,23].map(function(h){
    return '<text class="viz-axis" x="'+x(h).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+h+'h</text>';
  }).join('');
  return '<figure class="chart"><figcaption class="chart-title">Pile de production — GW (l\'aire du haut est le résiduel couvert par le gaz)</figcaption>' +
    '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Production par filière sur 24 heures">' +
      grid + paths + '<path class="load-line" d="'+loadPath+'"/>' + hl +
    '</svg>' +
    '<div class="viz-legend">' +
      '<span class="lg"><i class="sw-band f-wind"></i>Éolien</span>' +
      '<span class="lg"><i class="sw-band f-solar"></i>Solaire</span>' +
      '<span class="lg"><i class="sw-band f-gas"></i>Gaz &amp; pilotable</span>' +
      '<span class="lg"><i class="sw-line load"></i>Charge totale</span>' +
    '</div></figure>';
}

/* ---------- Prix système dérivé ---------- */
function sysPriceChart(day, sc){
  return priceChart({da:day.price, seriesLabels:{da:'Prix système ($/MWh)'}},
    {title:'Prix horaire qui en résulte — $/MWh'});
}

/* ---------- P&L par actif : la compensation rendue visible ---------- */
function assetBars(res){
  var assets = res.assets;
  var max = Math.max.apply(null, assets.map(function(a){ return Math.abs(a.pnl); }).concat([1]));
  var rows = assets.map(function(a){
    var w = Math.round(100*Math.abs(a.pnl)/max);
    return '<div class="abar">' +
      '<span class="an">'+esc(a.name)+'</span>' +
      '<span class="atrack"><span class="afill '+(a.pnl>=0?'pos':'neg')+'" style="width:'+w+'%"></span></span>' +
      '<span class="av mono '+(a.pnl>=0?'pos':'neg')+'">'+fmtK(a.pnl)+'</span>' +
    '</div>';
  }).join('');
  return '<div class="asset-bars"><span class="calc-head">P&L par actif — comment le portefeuille se compense</span>'+rows+
    '<div class="abar total"><span class="an">Total portefeuille</span><span class="atrack"></span>' +
    '<span class="av mono '+(res.total>=0?'pos':'neg')+'">'+fmtK(res.total)+'</span></div></div>';
}

function sysHud(){
  var rate = sys.rounds ? Math.round(100*sys.goodCalls/sys.rounds) : 0;
  var chips = [];
  if(sys.book.ppaWind) chips.push('PPA éolien '+sys.book.ppaStrike+' $');
  if(sys.book.tollCCGT) chips.push('Tolling CCGT');
  if(sys.book.gasHedgeUsed) chips.push('Gaz couvert');
  var riskUsed = sys.pnl < 0 ? Math.min(100, Math.round(100*Math.abs(sys.pnl)/Math.abs(SYS_RISK_LIMIT))) : 0;
  return '<div class="game-hud">' +
    '<div class="hud-box"><span class="hud-label">P&L cumulé</span>' +
      '<div class="hud-value '+(sys.pnl>0?'pos':(sys.pnl<0?'neg':''))+'">'+fmtK(sys.pnl)+'</div>' +
      '<span class="hud-sub">portefeuille 4 actifs</span></div>' +
    '<div class="hud-box"><span class="hud-label">Décisions optimales</span>' +
      '<div class="hud-value">'+sys.goodCalls+' / '+sys.rounds+'</div>' +
      '<span class="hud-sub">'+(sys.rounds ? rate+'% ex ante' : 'hors journées de structuration')+'</span></div>' +
    '<div class="hud-box"><span class="hud-label">Séquence</span><div class="hud-value">'+(sys.day+1)+' / '+SYS_LEN+'</div>' +
      '<span class="hud-sub">'+esc(sys.order[sys.day].season)+'</span></div>' +
    '<div class="hud-box"><span class="hud-label">Book de couvertures</span>' +
      '<div class="hud-value" style="font-size:.9rem;line-height:1.5;">'+(chips.length ? esc(chips.join(' · ')) : 'aucune')+'</div>' +
      '<div class="risk-meter"><span style="width:'+riskUsed+'%"></span></div></div>' +
  '</div>';
}

      html += '<div class="calc-wrap"><span class="calc-head">Lecture middle office</span><div class="calc">' +
        '<div><span>Gaz</span><span>'+r.day.gas.toFixed(2)+' $/MMBtu × heat rate 7,2 + 3 $ de coûts variables</span><span class="mono">'+Math.round(dt.ccgt.gasCost)+' $/MWh</span></div>' +
        '<div><span>CCGT</span><span>'+dt.ccgt.runHours+' h dans la monnaie, spark spread moyen '+Math.round(dt.ccgt.avgSpark)+' $/MWh</span><span class="mono">'+fmtK(r.breakdown.assets[0].pnl)+'</span></div>' +
        '<div><span>Éolien</span><span>'+Math.round(dt.wind.volume)+' MWh au prix de capture '+Math.round(dt.wind.capture)+' $/MWh</span><span class="mono">'+fmtK(r.breakdown.assets[1].pnl)+'</span></div>' +
        '<div><span>Solaire</span><span>'+Math.round(dt.solar.volume)+' MWh au prix de capture '+Math.round(dt.solar.capture)+' $/MWh</span><span class="mono">'+fmtK(r.breakdown.assets[2].pnl)+'</span></div>' +
        '<div><span>Batterie</span><span>'+dt.bess.cycles+' cycle(s), charge '+dt.bess.windows.charge.map(function(h){return h+'h';}).join(', ')+' → décharge '+dt.bess.windows.discharge.map(function(h){return h+'h';}).join(', ')+'</span><span class="mono">'+fmtK(r.breakdown.assets[3].pnl)+'</span></div>' +
      '</div></div>';
    }

    if(sc.noVerdict){
      html += '<div class="verdict neutral"><p class="vhead">Décision de structuration — pas de bonne réponse en espérance</p>' +
        '<p class="vtext">'+esc(r.opt.why)+'</p>' +
        '<p class="vtext dim">Ce type de décision engage plusieurs années : son effet réel apparaîtra dans le bilan de fin de partie, pas dans le P&L du jour. Elle ne compte donc pas dans ton score de décisions.</p></div>';
    } else {
      html += '<div class="verdict '+(r.optimal?'ok':'ko')+'">';
      if(r.optimal){
        html += '<p class="vhead">Décision optimale ex ante</p><p class="vtext">'+esc(r.opt.why)+'</p>';
      } else {
        html += '<p class="vhead">Une meilleure décision existait : « '+esc(r.bestEv.label)+' »</p>' +
          '<p class="vtext">'+esc(r.bestEv.why)+'</p>' +
          '<p class="vtext dim">Espérance de ton choix '+fmtK(r.table[sys.chosen].ev)+' contre '+fmtK(r.bestEv.ev)+'.</p>';
      }
      html += '</div>';
    }

    html += '<div class="table-wrap" style="margin-top:14px;"><table class="cmp opt-table"><thead><tr>' +
      '<th>Option</th><th>Espérance</th><th>Résultat réalisé</th></tr></thead><tbody>';
    r.table.forEach(function(t){
      var marks = (t.i === sys.chosen ? '<span class="tag-you">ton choix</span>' : '') +
                  (t.i === r.bestEv.i && !sc.noVerdict ? '<span class="tag-best">meilleure EV</span>' : '');
      html += '<tr class="'+(t.i===sys.chosen?'is-you':'')+'"><td>'+esc(t.label)+' '+marks+'</td>' +
        '<td class="mono '+(t.ev>=0?'pos':'neg')+'">'+fmtK(t.ev)+'</td>' +
        '<td class="mono '+(t.real>=0?'pos':'neg')+'">'+fmtK(t.real)+'</td></tr>';
    });
    html += '</tbody></table></div>';
    html += '<div class="lesson"><strong>À retenir —</strong> '+esc(sc.lesson)+'</div>';
    html += '</div>';
    html += '<div class="quiz-foot"><button class="btn btn-primary" data-sys="next">' +
      (sys.day >= SYS_LEN-1 || sys.busted ? 'Voir le bilan de l\'année' : 'Séquence suivante') + '</button></div>';
  }
  html += '</div>';
  return html;
}

function gameFoot(){
  if(game.busted) return '<div class="quiz-foot"><button class="btn btn-primary" data-game="next">Voir le bilan (limites coupées)</button></div>';
  var last = game.day >= GAME_LEN - 1;
  return '<div class="quiz-foot"><button class="btn btn-primary" data-game="next">'+(last?'Voir le bilan du mois':'Journée suivante')+'</button></div>';
}

function viewQuiz(){
  var q = session.queue[session.index];
  var n = session.queue.length;
  var pct = Math.round(100*session.index/n);
  var theme = THEME_BY_KEY[q.theme];
  var html = '';
  html += '<div class="quiz-head">' +
    '<span class="quiz-chip">'+theme.ticker+' · '+esc(session.label)+'</span>' +
    '<span class="qcounter mono">Question ' + (session.index+1) + ' / ' + n + '</span>' +
  '</div>';
  html += '<div class="progress-track"><span style="width:'+pct+'%"></span></div>';
  html += '<div class="card">';
  if(q.scenario){
    html += '<div class="scenario"><span class="label mono">SCÉNARIO</span>' + esc(q.scenario) + '</div>';
  }
  html += '<p class="qtext">' + esc(q.q) + '</p>';
  html += '<div class="options" id="optionsWrap">';
  var letters = ['A','B','C','D'];
  q.options.forEach(function(opt, i){
    html += '<button class="option" data-i="'+i+'"><span class="oletter">'+letters[i]+'</span><span>'+esc(opt)+'</span></button>';
  });
  html += '</div>';
  html += '<div id="feedbackWrap"></div>';
  html += '<div class="quiz-foot" id="quizFoot"></div>';
  html += '</div>';
  return html;
}

function viewSummary(){
  var s = session;
  var html = '<div class="hero"><div><h1>Résultats — '+esc(s.label)+'</h1>' +
    '<p>Session terminée. Les questions manquées rejoignent automatiquement votre file de révision.</p></div></div>';
  html += '<div class="summary-stats">' +
    '<div class="stat-box good"><div class="stat-num mono">'+s.correctCount+'</div><div class="stat-label">Correctes</div></div>' +
    '<div class="stat-box bad"><div class="stat-num mono">'+s.wrongCount+'</div><div class="stat-label">Erreurs</div></div>' +
    '<div class="stat-box"><div class="stat-num mono">'+Math.round(100*s.correctCount/(s.correctCount+s.wrongCount||1))+'%</div><div class="stat-label">Score</div></div>' +
  '</div>';
  if(s.missed.length){
    html += '<section class="block"><h2>À revoir</h2>';
    s.missed.forEach(function(m){
      html += '<div class="missed-item"><p class="mq">'+esc(m.q)+'</p><p class="ma">Réponse correcte : '+esc(m.correctText)+'</p></div>';
    });
    html += '</section>';
  } else {
    html += '<div class="empty"><div class="big">100%</div>Sans faute sur cette session.</div>';
  }
  html += '<div class="actions-row">' +
    '<button class="btn btn-primary" data-nav="dashboard">Retour au dashboard</button>' +
    (s.missed.length ? '<button class="btn" data-nav="review">Réviser ces erreurs maintenant</button>' : '') +
  '</div>';
  return html;
}

/* =========================================================
   EVENTS
   ========================================================= */
function goNav(nav){
  if(nav === 'dashboard'){ app.view='dashboard'; render(); return; }
  if(nav === 'reference'){ app.view='reference'; render(); return; }
  if(nav === 'game'){ app.view='game'; render(); return; }
  if(nav === 'system'){ app.view='system'; render(); return; }
  if(nav === 'review'){
    var q = reviewQueue();
    if(q.length===0){ app.view='dashboard'; render(); flashEmpty(); return; }
    startSession(q, 'Révision des erreurs');
    return;
  }
  if(nav === 'exam'){
    startSession(shuffle(QUESTIONS).slice(0,20), 'Examen blanc');
    return;
  }
  if(nav.indexOf('theme:') === 0){
    var key = nav.slice(6);
    var qs = QUESTIONS.filter(function(q){ return q.theme===key; });
    session = null;
    startSession(qs, THEME_BY_KEY[key].label);
    session.themeKey = key;
    render();
    return;
  }
}

function flashEmpty(){
  var c = document.getElementById('content');
  var note = document.createElement('div');
  note.className = 'empty';
  note.innerHTML = '<div class="big">✓</div>Aucune erreur en attente de révision pour le moment.';
  c.prepend(note);
}

/* Hover layer on the price charts: crosshair value readout. */
document.addEventListener('mousemove', function(e){
  var t = e.target;
  if(!t || !t.closest) return;
  var fig = t.closest('.chart');
  document.querySelectorAll('.chart-tip').forEach(function(tip){
    if(!fig || tip.parentNode !== fig) tip.hidden = true;
  });
  if(!fig || !t.closest('.chart-hit')) return;
  var tip = fig.querySelector('.chart-tip');
  if(!tip) return;
  var raw = fig.getAttribute('data-chart');
  if(!raw) return;
  var d;
  try{ d = JSON.parse(raw); }catch(err){ return; }
  var box = fig.querySelector('.chart-svg').getBoundingClientRect();
  var frac = (e.clientX - box.left) / box.width;
  var padFrac = 46/720, rightFrac = 12/720;
  var inner = (frac - padFrac) / (1 - padFrac - rightFrac);
  var h = Math.max(0, Math.min(23, Math.round(inner*23)));
  var figBox = fig.getBoundingClientRect();
  tip.innerHTML = '<span class="th">' + h + 'h — ' + h + 'h59</span>' +
    d.labels[0] + ' ' + Math.round(d.da[h]) + ' $/MWh' +
    (d.rt ? '<br>' + d.labels[1] + ' ' + Math.round(d.rt[h]) + ' $/MWh' : '');
  tip.style.left = (e.clientX - figBox.left) + 'px';
  tip.style.top = (e.clientY - figBox.top) + 'px';
  tip.hidden = false;
});

/* One delegated listener: survives every innerHTML rebuild of the rail, HUD and content. */
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest) return;

  var nav = t.closest('[data-nav]');
  if(nav){ goNav(nav.getAttribute('data-nav')); return; }

  if(t.closest('#dueBtn')){ goNav('review'); return; }

  var opt = t.closest('.option');
  if(opt && app.view === 'quiz' && !opt.disabled){
    answerQuestion(parseInt(opt.getAttribute('data-i'), 10));
    return;
  }

  if(t.closest('[data-quiz="next"]')){
    if(session.index >= session.queue.length - 1){ app.view = 'summary'; }
    else { session.index++; session.answered = false; }
    render();
    return;
  }

  var sysEl = t.closest('[data-sys]');
  if(sysEl){ sysAction(sysEl.getAttribute('data-sys')); return; }

  var sysChoice = t.closest('[data-syschoice]');
  if(sysChoice && !sysChoice.disabled){ sysChoose(parseInt(sysChoice.getAttribute('data-syschoice'), 10)); return; }

  var gameEl = t.closest('[data-game]');
  if(gameEl){ gameAction(gameEl.getAttribute('data-game')); return; }

  var choice = t.closest('[data-choice]');
  if(choice && !choice.disabled){ gameChoose(parseInt(choice.getAttribute('data-choice'), 10)); return; }

  var gq = t.closest('[data-gq]');
  if(gq && !gq.disabled){ gameAnswerQuiz(parseInt(gq.getAttribute('data-gq'), 10)); return; }

  if(t.closest('#resetBtn')){
    if(confirm('Réinitialiser toute votre progression et votre historique de révision ?')){
      progress = {};
      saveProgress();
      app.view = 'dashboard';
      session = null;
      game = null;
      sys = null;
      render();
    }
    return;
  }
});

function answerQuestion(i){
  if(session.answered) return;
  session.answered = true;
  var q = session.queue[session.index];
  var ok = (i === q.correct);
  record(q.id, ok);
  if(ok){ session.correctCount++; } else {
    session.wrongCount++;
    session.missed.push({q:q.q, correctText:q.options[q.correct]});
  }

  var opts = document.querySelectorAll('.option');
  opts.forEach(function(btn, idx){
    btn.disabled = true;
    if(idx === q.correct) btn.classList.add('correct');
    else if(idx === i) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  var fb = document.getElementById('feedbackWrap');
  fb.innerHTML = '<div class="feedback '+(ok?'ok':'ko')+'">' +
    '<p class="ftitle">'+(ok?'Correct.':'Pas tout à fait.')+'</p>' +
    '<p>'+esc(q.explain)+'</p>' +
  '</div>';

  var isLast = session.index >= session.queue.length - 1;
  var foot = document.getElementById('quizFoot');
  foot.innerHTML = '<button class="btn btn-primary" data-quiz="next">'+(isLast?'Voir les résultats':'Question suivante')+'</button>';

  renderTopStats();
  renderRail();
}

render();
})();
</script>
