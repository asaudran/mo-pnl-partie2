<title>Storage Desk Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1ef;
    --surface:#ffffff;
    --surface-2:#e2e9e5;
    --border:#c6d1cb;
    --text:#101a1a;
    --text-muted:#53615e;
    --accent:#a5540e;
    --accent-ink:#fffaf3;
    --accent-bg:#f2e3d3;
    --teal:#0e7a76;
    --teal-bg:#dcefec;
    --good:#1c8a56;
    --good-bg:#e2f3e8;
    --bad:#bd3a3a;
    --bad-bg:#fbe7e6;
    --focus:#0e7a76;
    --shadow:0 1px 2px rgba(16,26,26,.06),0 8px 20px rgba(16,26,26,.07);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1414;
      --surface:#111d1e;
      --surface-2:#172626;
      --border:#243635;
      --text:#eaf3f0;
      --text-muted:#9db0ac;
      --accent:#efa552;
      --accent-ink:#1c1104;
      --accent-bg:rgba(239,165,82,.14);
      --teal:#54d9cd;
      --teal-bg:rgba(84,217,205,.14);
      --good:#4bdb8b;
      --good-bg:rgba(75,219,139,.14);
      --bad:#f9827c;
      --bad-bg:rgba(249,130,124,.14);
      --focus:#54d9cd;
      --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1414;
    --surface:#111d1e;
    --surface-2:#172626;
    --border:#243635;
    --text:#eaf3f0;
    --text-muted:#9db0ac;
    --accent:#efa552;
    --accent-ink:#1c1104;
    --accent-bg:rgba(239,165,82,.14);
    --teal:#54d9cd;
    --teal-bg:rgba(84,217,205,.14);
    --good:#4bdb8b;
    --good-bg:rgba(75,219,139,.14);
    --bad:#f9827c;
    --bad-bg:rgba(249,130,124,.14);
    --focus:#54d9cd;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Source Serif 4',Georgia,'Times New Roman',serif;
    line-height:1.55;
  }
  h1,h2,h3,.brand-name,.nav-label,.stat-value,button{font-family:'Archivo',system-ui,-apple-system,sans-serif;}
  .mono,.ticker,.stat-num,.pct,.qcounter{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;}
  h1,h2,h3{text-wrap:balance;}
  a{color:var(--teal);}
  button{font:inherit;color:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important;}
  }

  .app{max-width:1180px;margin:0 auto;padding:0 20px 60px;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex;align-items:center;gap:16px;
    padding:22px 0 18px;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;flex:1;min-width:220px;}
  .brand-mark{flex:none;color:var(--accent);}
  .brand-text{display:flex;flex-direction:column;gap:2px;}
  .brand-name{font-weight:800;font-size:1.28rem;letter-spacing:-.01em;}
  .brand-sub{font-family:'Source Serif 4',serif;font-size:.86rem;color:var(--text-muted);font-style:italic;}
  .global-stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pill{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--border);background:var(--surface);
    border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:600;
    box-shadow:var(--shadow);
  }
  .pill .pct{color:var(--accent);font-weight:600;}
  .pill-btn{border:1px solid var(--border);background:var(--surface-2);}
  .pill-btn.due .pct{color:var(--bad);}
  .pill-btn:hover{border-color:var(--teal);}

  /* ---------- Layout ---------- */
  .layout{display:grid;grid-template-columns:236px 1fr;gap:26px;margin-top:24px;align-items:start;}

  .rail{display:flex;flex-direction:column;gap:5px;position:sticky;top:20px;}
  .rail-section-label{
    font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.09em;
    text-transform:uppercase;color:var(--text-muted);margin:16px 4px 4px;
  }
  .rail-section-label:first-child{margin-top:0;}
  .rail-btn{
    display:flex;align-items:center;gap:10px;
    background:transparent;border:1px solid transparent;border-radius:10px;
    padding:9px 10px;text-align:left;width:100%;
  }
  .rail-btn:hover{background:var(--surface-2);}
  .rail-btn.active{background:var(--surface);border-color:var(--border);box-shadow:var(--shadow);}
  .rail-btn .ticker{
    flex:none;font-size:.66rem;font-weight:600;letter-spacing:.03em;
    color:var(--accent);border:1px solid var(--border);background:var(--accent-bg);
    border-radius:6px;padding:3px 6px;min-width:44px;text-align:center;
  }
  .rail-btn .rlabel{flex:1;font-size:.86rem;font-weight:600;line-height:1.2;}
  .rail-btn .rmeta{font-size:.7rem;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;}
  .rail-btn.review .ticker{color:var(--bad);background:var(--bad-bg);}
  .rail-btn.exam .ticker{color:var(--teal);background:var(--teal-bg);}
  .rail-progress{height:3px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:4px;}
  .rail-progress > span{display:block;height:100%;background:var(--accent);}

  main.content{min-width:0;}

  /* ---------- Cards / generic ---------- */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px 24px;box-shadow:var(--shadow);
  }
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .theme-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:10px;
    box-shadow:var(--shadow);
  }
  .theme-card:hover{border-color:var(--teal);}
  .theme-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .theme-card h3{margin:0;font-size:1rem;line-height:1.25;}
  .theme-card .ticker{
    font-size:.68rem;font-weight:600;color:var(--accent);background:var(--accent-bg);
    border:1px solid var(--border);border-radius:6px;padding:3px 7px;
  }
  .theme-card .desc{font-size:.82rem;color:var(--text-muted);font-family:'Source Serif 4',serif;}
  .bar-track{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;}
  .bar-fill{display:block;height:100%;background:var(--accent);}
  .theme-card .row{display:flex;justify-content:space-between;font-size:.72rem;color:var(--text-muted);}
  .theme-card .due{color:var(--bad);font-weight:600;}

  .hero{display:flex;justify-content:space-between;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:22px;}
  .hero h1{margin:0 0 6px;font-size:1.5rem;}
  .hero p{margin:0;color:var(--text-muted);max-width:56ch;}
  .ring{position:relative;width:96px;height:96px;flex:none;}
  .ring svg{transform:rotate(-90deg);}
  .ring .ring-num{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:1.15rem;
  }

  .actions-row{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 28px;}
  .btn{
    border-radius:10px;padding:11px 18px;font-weight:600;font-size:.9rem;border:1px solid var(--border);
    background:var(--surface);box-shadow:var(--shadow);
  }
  .btn:hover{border-color:var(--teal);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-ghost{background:transparent;box-shadow:none;}
  .btn:disabled{opacity:.45;cursor:default;}

  section.block{margin-top:34px;}
  section.block > h2{font-size:1.05rem;margin:0 0 12px;display:flex;align-items:center;gap:10px;}
  section.block > h2 .ticker{
    font-size:.68rem;font-weight:600;color:var(--teal);background:var(--teal-bg);
    border:1px solid var(--border);border-radius:6px;padding:3px 7px;
  }

  /* ---------- Reference view ---------- */
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  table.cmp{width:100%;border-collapse:collapse;min-width:760px;background:var(--surface);}
  table.cmp th,table.cmp td{
    text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);font-size:.82rem;vertical-align:top;
  }
  table.cmp thead th{
    font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;
    color:var(--text-muted);background:var(--surface-2);
  }
  table.cmp tbody tr:last-child td{border-bottom:none;}
  table.cmp td:first-child{font-weight:600;white-space:nowrap;}

  .fiche-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:18px;}
  .fiche{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
  .fiche h3{margin:0 0 8px;font-size:.98rem;display:flex;align-items:center;gap:8px;}
  .fiche h3 .ticker{font-size:.62rem;background:var(--accent-bg);color:var(--accent);border:1px solid var(--border);border-radius:5px;padding:2px 6px;}
  .fiche p{margin:0 0 8px;font-size:.88rem;}
  .fiche p:last-child{margin-bottom:0;}
  .fiche .label{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:2px;}
  .fiche .note{font-size:.78rem;color:var(--text-muted);border-top:1px dashed var(--border);padding-top:8px;margin-top:10px;}

  /* ---------- Quiz view ---------- */
  .quiz-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .quiz-chip{
    font-size:.7rem;font-weight:600;padding:4px 10px;border-radius:999px;
    background:var(--teal-bg);color:var(--teal);font-family:'IBM Plex Mono',monospace;
  }
  .qcounter{font-size:.8rem;color:var(--text-muted);}
  .progress-track{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-bottom:22px;}
  .progress-track > span{display:block;height:100%;background:var(--teal);}

  .scenario{
    background:var(--surface-2);border-left:3px solid var(--teal);border-radius:0 10px 10px 0;
    padding:14px 18px;margin-bottom:16px;font-size:.92rem;font-style:italic;color:var(--text);
  }
  .scenario .label{font-style:normal;display:block;margin-bottom:4px;}
  .qtext{font-size:1.15rem;font-weight:500;line-height:1.4;margin:0 0 20px;font-family:'Source Serif 4',serif;text-wrap:balance;}

  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;gap:12px;align-items:flex-start;
    text-align:left;padding:13px 16px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);font-size:.92rem;
  }
  .option:hover:not(:disabled){border-color:var(--teal);}
  .option .oletter{
    flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;
    font-size:.72rem;font-weight:600;color:var(--text-muted);
  }
  .option.correct{background:var(--good-bg);border-color:var(--good);}
  .option.correct .oletter{background:var(--good);color:var(--surface);}
  .option.wrong{background:var(--bad-bg);border-color:var(--bad);}
  .option.wrong .oletter{background:var(--bad);color:var(--surface);}
  .option.dim{opacity:.55;}

  .feedback{margin-top:18px;padding:16px 18px;border-radius:10px;border:1px solid var(--border);}
  .feedback.ok{background:var(--good-bg);border-color:var(--good);}
  .feedback.ko{background:var(--bad-bg);border-color:var(--bad);}
  .feedback .ftitle{font-weight:700;margin:0 0 6px;font-family:'Archivo',sans-serif;font-size:.92rem;}
  .feedback.ok .ftitle{color:var(--good);}
  .feedback.ko .ftitle{color:var(--bad);}
  .feedback p{margin:0;font-size:.9rem;}

  .quiz-foot{display:flex;justify-content:flex-end;margin-top:20px;}

  /* ---------- Summary ---------- */
  .summary-stats{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0 24px;}
  .stat-box{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 20px;box-shadow:var(--shadow);min-width:130px;
  }
  .stat-box .stat-num{font-size:1.5rem;font-weight:600;}
  .stat-box .stat-label{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-family:'IBM Plex Mono',monospace;}
  .stat-box.good .stat-num{color:var(--good);}
  .stat-box.bad .stat-num{color:var(--bad);}
  .missed-item{border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:10px;background:var(--surface);}
  .missed-item .mq{font-weight:600;font-size:.88rem;margin:0 0 4px;}
  .missed-item .ma{font-size:.82rem;color:var(--good);margin:0;}

  .empty{
    text-align:center;padding:50px 20px;color:var(--text-muted);
  }
  .empty .big{font-size:2rem;margin-bottom:6px;}

  footer.reset-row{margin-top:44px;text-align:center;}
  footer.reset-row button{background:none;border:none;color:var(--text-muted);font-size:.76rem;text-decoration:underline;box-shadow:none;}

  .disclaimer{
    margin-top:10px;font-size:.78rem;color:var(--text-muted);background:var(--surface-2);
    border-radius:10px;padding:10px 14px;
  }

  /* ---------- Game (PnL Maker) ---------- */
  .rail-btn.game .ticker{color:var(--teal);background:var(--teal-bg);}
  .game-hud{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .hud-box{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 16px;box-shadow:var(--shadow);flex:1 1 150px;
  }
  .hud-label{
    font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--text-muted);display:block;
  }
  .hud-value{
    font-family:'IBM Plex Mono',monospace;font-size:1.3rem;font-weight:600;
    font-variant-numeric:tabular-nums;margin-top:2px;
  }
  .hud-value.pos{color:var(--good);}
  .hud-value.neg{color:var(--bad);}
  .hud-sub{font-size:.72rem;color:var(--text-muted);}
  .risk-meter{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px;}
  .risk-meter > span{display:block;height:100%;background:var(--bad);}
  .spark{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:8px;}
  .spark span{flex:1;min-width:3px;border-radius:2px 2px 0 0;background:var(--accent);}
  .spark span.neg{background:var(--bad);}
  .ctx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:14px 0 18px;}
  .ctx-item{background:var(--surface-2);border-radius:9px;padding:9px 12px;}
  .ctx-item .k{
    font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.07em;
    text-transform:uppercase;color:var(--text-muted);display:block;
  }
  .ctx-item .v{font-size:.84rem;font-weight:600;}
  .choice{
    display:flex;flex-direction:column;gap:3px;text-align:left;
    padding:14px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  }
  .choice:hover:not(:disabled){border-color:var(--accent);}
  .choice .ctag{
    font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.06em;
    text-transform:uppercase;color:var(--teal);
  }
  .choice .ctitle{font-family:'Source Serif 4',serif;font-size:.94rem;font-weight:600;}
  .choice.chosen{border-color:var(--accent);background:var(--accent-bg);}
  .choice.dim{opacity:.5;}
  .resolution{
    margin-top:18px;padding:16px 18px;border-radius:10px;
    border:1px solid var(--border);background:var(--surface-2);
  }
  .pnl-delta{
    font-family:'IBM Plex Mono',monospace;font-size:1.7rem;font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .pnl-delta.pos{color:var(--good);}
  .pnl-delta.neg{color:var(--bad);}
  .lesson{
    border-top:1px dashed var(--border);margin-top:12px;padding-top:10px;
    font-size:.85rem;color:var(--text-muted);
  }

  /* ---------- Responsive (kept last so it wins over the base rules above) ---------- */
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    .rail{
      display:flex;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:10px;
      border-bottom:1px solid var(--border);
      position:static;top:auto;
    }
    .rail-section-label{display:none;}
    .rail-btn{flex:none;min-width:168px;}
  }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
        <polyline points="2,24 9,24 13,9 18,29 22,16 26,20 32,20" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Storage Desk Drill</span>
        <span class="brand-sub">Batteries · ERCOT · Contrats power — prep Middle Office Houston</span>
      </div>
    </div>
    <div class="global-stats" id="globalStats"></div>
  </header>

  <div class="layout">
    <nav class="rail" id="rail"></nav>
    <main class="content" id="content"></main>
  </div>

  <footer class="reset-row">
    <button id="resetBtn" type="button">Réinitialiser ma progression</button>
  </footer>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   DATA — question bank
   ========================================================= */
var THEMES = [
  {key:'fundamentals', ticker:'BESS', label:'Fondamentaux batteries', desc:'Techno, puissance/énergie, RTE, dégradation.'},
  {key:'ercot',        ticker:'ERCOT', label:'Marché ERCOT / Texas', desc:'Nodal, DAM/RTM, SCED, RTC+B.'},
  {key:'ancillary',    ticker:'A/S', label:'Services auxiliaires', desc:'RegUp/Down, RRS, ECRS, Non-Spin.'},
  {key:'imbalance',    ticker:'IMB', label:'Imbalances & temps réel', desc:'Base DA-RT, déviations, règlement.'},
  {key:'contracts',    ticker:'PPA', label:'Contrats physiques & financiers', desc:'PPA, tolling, collar — les distinguer.'},
  {key:'valuation',    ticker:'VAL', label:'Valorisation', desc:'Revenue stacking, LCOS, NPV, ELCC.'},
  {key:'risk',         ticker:'RISK', label:'Risques', desc:'Prix, base, dégradation, contrepartie...'},
  {key:'hedging',      ticker:'HDG', label:'Couvertures', desc:'Swaps, options, collars, tolling, puts.'},
  {key:'orders',       ticker:'O/M', label:'Ordres de grandeur', desc:'Chiffres clés à avoir en tête.'},
  {key:'cases',        ticker:'CASE', label:"Cas d'étude réels", desc:'Scénarios : risques & hedging en situation.'}
];
var THEME_BY_KEY = {};
THEMES.forEach(function(t){ THEME_BY_KEY[t.key] = t; });

var QUESTIONS = [
/* ---------------- FUNDAMENTALS ---------------- */
{id:'f1', theme:'fundamentals', q:`Une batterie annoncée "100 MW / 400 MWh" a quelle durée de décharge nominale ?`,
 options:[`1 heure`,`2 heures`,`4 heures`,`8 heures`], correct:2,
 explain:`Durée = Énergie (MWh) / Puissance (MW) = 400/100 = 4h. C'est la convention standard pour décrire un BESS : puissance (MW) et durée (h), l'énergie (MWh) s'en déduisant.`},
{id:'f2', theme:'fundamentals', q:`Que signifie le "C-rate" d'une batterie ?`,
 options:[`Le taux de charge/décharge relatif à sa capacité énergétique (1C = pleine décharge en 1h)`,`Le coefficient de dégradation annuel`,`Le coût par kWh installé`,`Le facteur de charge du réseau`], correct:0,
 explain:`Un C-rate de 0,25C correspond à une décharge complète en 4h (durée = 1/C-rate). Une batterie 4h a donc un C-rate plus faible (0,25C) qu'une batterie 1h (1C), ce qui dimensionne différemment le PCS/onduleur.`},
{id:'f3', theme:'fundamentals', q:`Quelle chimie domine aujourd'hui les BESS stationnaires utility-scale aux États-Unis ?`,
 options:[`NMC (Nickel-Manganèse-Cobalt)`,`LFP (Lithium-Fer-Phosphate)`,`Plomb-acide`,`Sodium-soufre`], correct:1,
 explain:`Le LFP domine le stationnaire grâce à sa meilleure tenue en cyclage et sa stabilité thermique/sécurité, au prix d'une densité énergétique plus faible que le NMC — moins pénalisant pour du stationnaire que pour l'automobile.`},
{id:'f4', theme:'fundamentals', q:`Le rendement aller-retour (Round-Trip Efficiency, RTE) d'un BESS Li-ion moderne est de l'ordre de...`,
 options:[`60-70%`,`75-80%`,`85-92%`,`98-99%`], correct:2,
 explain:`85-92% (AC-AC) est typique pour un système LFP moderne, pertes de conversion PCS, cellule et auxiliaires (climatisation) incluses. Ce chiffre conditionne directement la marge réellement capturable sur un spread d'arbitrage.`},
{id:'f5', theme:'fundamentals', q:`Qu'est-ce que "l'augmentation" (augmentation) d'un BESS ?`,
 options:[`L'ajout de modules/cellules supplémentaires au fil du temps pour compenser la dégradation et tenir la capacité contractuelle`,`L'augmentation de la puissance de l'onduleur`,`La hausse tarifaire appliquée par l'opérateur réseau`,`Le fait d'augmenter le nombre de cycles journaliers`], correct:0,
 explain:`Les projets prévoient souvent un surdimensionnement initial et/ou un plan d'augmentation (ajout de cellules à des jalons, ex. année 5 et 10) pour tenir l'engagement de capacité malgré la dégradation — un poste de capex à modéliser dans toute valorisation long terme.`},
{id:'f6', theme:'fundamentals', q:`Pourquoi la durée moyenne des nouveaux projets BESS en ERCOT tend-elle à s'allonger (de 1-2h vers 4h) ?`,
 options:[`Les batteries 4h coûtent moins cher à produire`,`Une durée plus longue capture un spread journalier plus large et bénéficie d'une meilleure accréditation de capacité (ELCC)`,`La réglementation ERCOT interdit désormais les durées courtes`,`Les batteries courte durée ne peuvent pas fournir de services auxiliaires`], correct:1,
 explain:`Avec la saturation des services auxiliaires et la compression des marges court terme, une durée plus longue permet de capter une plus grande part de l'écart de prix journalier (creux nuit / pointe soir) et reçoit une meilleure accréditation de capacité — la valeur ELCC croissant avec la durée.`},
{id:'f7', theme:'fundamentals', q:`Le State of Charge (SOC) d'une batterie désigne...`,
 options:[`Son niveau de charge actuel, en % de sa capacité utile`,`Son état de santé (dégradation cumulée)`,`Sa position de marché nette`,`Son statut de raccordement au réseau`], correct:0,
 explain:`SOC = niveau de charge instantané, à ne pas confondre avec le SOH (State of Health), qui mesure la dégradation/capacité résiduelle disponible dans le temps.`},
{id:'f8', theme:'fundamentals', q:`Pourquoi le SOC est-il devenu une contrainte centrale du dispatch ERCOT depuis RTC+B (déc. 2025) ?`,
 options:[`Il n'a aucun impact sur le dispatch`,`SCED intègre désormais le SOC télémesuré de chaque batterie toutes les 5 minutes dans ses décisions d'awards énergie + réserves`,`Le SOC détermine uniquement le prix de marché`,`ERCOT facture le SOC comme un service auxiliaire à part`], correct:1,
 explain:`RTC+B modélise la batterie comme un actif unifié avec état de charge : SCED intègre ce SOC toutes les 5 minutes, notamment pour l'éligibilité au Non-Spin, plutôt que de traiter la batterie comme deux ressources séparées (génération + charge).`},
{id:'f9', theme:'fundamentals', q:`L'auxiliaire (consommation parasite : climatisation/HVAC des containers, contrôle...) d'un BESS a pour effet de...`,
 options:[`Améliorer le RTE`,`Réduire le RTE net et donc la marge d'arbitrage réellement capturée`,`N'avoir aucun impact sur la performance`,`Augmenter la puissance disponible`], correct:1,
 explain:`L'énergie consommée par le refroidissement/chauffage des packs et le PCS en veille s'ajoute aux pertes de conversion — un point souvent sous-estimé dans les backtests "gross" par rapport à la performance nette réelle.`},
{id:'f10', theme:'fundamentals', q:`Pour quel type de service auxiliaire une batterie est-elle mieux positionnée qu'une centrale thermique, grâce à sa vitesse de réponse ?`,
 options:[`Non-Spin (réserve non synchronisée, ~30 min)`,`RegUp/RegDown (régulation de fréquence, réponse quasi instantanée)`,`Aucun, les deux technologies sont équivalentes`,`Uniquement le black-start`], correct:1,
 explain:`La réponse en secondes (voire sub-seconde) d'un BESS en fait un fournisseur idéal de régulation de fréquence (RegUp/RegDown) et de réserve rapide (RRS), là où une unité thermique met plusieurs minutes à ajuster sa production.`},

/* ---------------- ERCOT MARKET ---------------- */
{id:'e1', theme:'ercot', q:`ERCOT est historiquement qualifié de marché...`,
 options:[`"Capacity market" avec paiements de capacité obligatoires (comme PJM)`,`"Energy-only market", où la rareté est rémunérée via les prix spot plutôt que via un paiement de capacité centralisé`,`Marché régulé à tarifs fixes`,`Marché exclusivement bilatéral, sans bourse organisée`], correct:1,
 explain:`Contrairement à PJM/ISO-NE/NYISO, ERCOT n'a pas de marché de capacité centralisé : la rémunération de la rareté passe par des pics de prix spot (scarcity pricing) — ce qui accentue l'importance de la volatilité prix pour la rentabilité des actifs, batteries incluses.`},
{id:'e2', theme:'ercot', q:`Quelle est la différence fondamentale entre le Day-Ahead Market (DAM) et le Real-Time Market (RTM) en ERCOT ?`,
 options:[`Le DAM est une bourse financière J-1 engageante ; le RTM est le dispatch physique réel via SCED toutes les 5 minutes`,`Le DAM ne concerne que le gaz naturel`,`Le RTM fixe les prix pour toute la semaine suivante`,`Il n'y a pas de différence, ce sont deux noms pour le même marché`], correct:0,
 explain:`Le DAM est une enchère financière J-1 (engagement horaire) ; le RTM reflète le dispatch physique réel, recalculé toutes les 5 minutes par SCED. L'écart entre les deux (base DA-RT) est une source majeure de risque et d'opportunité.`},
{id:'e3', theme:'ercot', q:`Que signifie SCED dans le fonctionnement d'ERCOT ?`,
 options:[`Security-Constrained Economic Dispatch — le moteur de dispatch temps réel toutes les 5 minutes`,`Un type de contrat d'achat d'électricité`,`Le système de facturation des clients résidentiels`,`Le comité de gouvernance d'ERCOT`], correct:0,
 explain:`SCED calcule toutes les 5 minutes le dispatch au moindre coût sous contraintes réseau. Depuis RTC+B, SCED co-optimise conjointement l'énergie ET les services auxiliaires.`},
{id:'e4', theme:'ercot', q:`Le prix de marché reçu par un générateur en temps réel dépend en premier lieu de...`,
 options:[`Son nœud de règlement (Settlement Point), qui peut différer significativement du prix des hubs en cas de congestion`,`Son ancienneté sur le marché`,`Le type de propriétaire (fonds vs utility)`,`Le nombre d'employés de l'exploitant`], correct:0,
 explain:`Chaque ressource se règle à son "resource node" ; hubs et load zones agrègent plusieurs nœuds. L'écart entre le prix nodal réel et un hub de référence (utilisé par ex. dans un PPA financier) constitue le risque de base géographique/congestion.`},
{id:'e5', theme:'ercot', q:`Quel est le plafond de prix système (System-Wide Offer Cap, HCAP) actuellement en vigueur en ERCOT ?`,
 options:[`1 000 $/MWh`,`2 000 $/MWh`,`5 000 $/MWh`,`9 000 $/MWh`], correct:2,
 explain:`Le PUCT a abaissé le plafond de 9 000 $/MWh à 5 000 $/MWh (HCAP), avec un plafond bas (LCAP) de 2 000 $/MWh hors rareté déclarée. Sous RTC+B, ce plafond est désormais scindé : DASWCAP 5 000 $/MWh (Day-Ahead) et RTSWCAP 2 000 $/MWh (Real-Time).`},
{id:'e6', theme:'ercot', q:`Qu'est-ce que l'ORDC (Operating Reserve Demand Curve), et que lui est-il arrivé avec RTC+B ?`,
 options:[`Un mécanisme ajoutant un "adder" de rareté au prix d'énergie selon le niveau de réserves ; il a été remplacé par des courbes de demande par service auxiliaire (ASDC) intégrées au SCED`,`Un indicateur de performance ESG d'ERCOT`,`Une taxe carbone appliquée aux générateurs thermiques`,`Un contrat de couverture spécifique aux batteries`], correct:0,
 explain:`L'ORDC ajoutait un supplément de prix énergie reflétant la rareté des réserves. RTC+B le remplace par des Ancillary Service Demand Curves (ASDC) co-optimisées directement dans SCED toutes les 5 minutes.`},
{id:'e7', theme:'ercot', q:`RTC+B (Real-Time Co-optimization plus Batteries) est entré en vigueur...`,
 options:[`En 2019`,`Le 5 décembre 2025`,`Il est encore en projet, non lancé`,`En 2030`], correct:1,
 explain:`ERCOT a lancé RTC+B le 5 décembre 2025 — qualifié de plus grand changement de marché depuis 15 ans. Un jalon à connaître absolument avant de rejoindre un desk batteries à Houston.`},
{id:'e8', theme:'ercot', q:`Le règlement du Real-Time Settlement Point Price s'effectue traditionnellement sur un intervalle de...`,
 options:[`5 minutes (un seul prix SCED)`,`15 minutes, en moyennant les intervalles SCED de 5 minutes qui le composent`,`1 heure`,`1 jour`], correct:1,
 explain:`Le règlement réel utilise un intervalle de 15 minutes, calculé à partir de la moyenne des prix SCED de 5 minutes qui le composent — important pour comprendre le décalage entre dispatch (5 min) et facturation (15 min).`},
{id:'e9', theme:'ercot', q:`Quelle affirmation décrit le mieux l'évolution récente du mix de production en ERCOT ?`,
 options:[`Le nucléaire domine désormais avec plus de 60% de la production`,`Éolien et solaire combinés représentent une part significative et croissante (de l'ordre de 40%+) de la production, avec un développement rapide du stockage en parallèle`,`Le charbon est la seule source en croissance`,`ERCOT importe la majorité de son énergie d'autres réseaux`], correct:1,
 explain:`Éolien et solaire combinés ont atteint environ 40% de la production ERCOT mi-2024, avec une poursuite de la croissance du solaire et du stockage (~14 GW de batteries entrant en 2026) — un contexte essentiel pour comprendre la compression des spreads et la "duck curve" texane.`},
{id:'e10', theme:'ercot', q:`En ERCOT, la "congestion" désigne...`,
 options:[`Une limite du réseau de transport empêchant l'énergie la moins chère de circuler librement, créant des écarts de prix entre nœuds`,`Un embouteillage physique de camions de gaz`,`Le nombre de participants de marché inscrits`,`Un type de service auxiliaire`], correct:0,
 explain:`Quand une contrainte de transport est active, SCED doit redispatcher vers des unités plus chères en aval, créant des écarts de prix nodaux (basis) — un risque clé pour tout actif dont le règlement contractuel diffère du nœud physique réel.`},

/* ---------------- ANCILLARY SERVICES ---------------- */
{id:'a1', theme:'ancillary', q:`Combien de grandes familles de services auxiliaires ERCOT propose-t-il actuellement ?`,
 options:[`Aucune, ERCOT n'a pas de marché de services auxiliaires`,`RegUp, RegDown, RRS, ECRS et Non-Spin`,`Uniquement la réserve tournante`,`Un seul produit unique "Ancillary"`], correct:1,
 explain:`Oui, ERCOT dispose bien d'un marché de services auxiliaires actif : Regulation Up/Down, Responsive Reserve Service (RRS), ERCOT Contingency Reserve Service (ECRS) et Non-Spinning Reserve.`},
{id:'a2', theme:'ancillary', q:`Qu'est-ce que le RRS (Responsive Reserve Service) ?`,
 options:[`Une réserve rapide répondant aux déviations de fréquence en cas d'événement de contingence`,`Un service de facturation des clients résidentiels`,`Un produit exclusivement gazier`,`Un mécanisme de paiement de capacité annuel`], correct:0,
 explain:`Le RRS fournit une réponse rapide (secondes) à une chute de fréquence suite à la perte d'une grande unité de production — les batteries, avec leur temps de réponse quasi instantané, y sont particulièrement compétitives.`},
{id:'a3', theme:'ancillary', q:`Pourquoi ERCOT a-t-il introduit le service ECRS (ERCOT Contingency Reserve Service) en 2023 ?`,
 options:[`Pour remplacer totalement le marché d'énergie`,`Pour renforcer la réserve disponible sur un horizon plus long (~30 min) après les préoccupations de fiabilité post-Winter Storm Uri (2021)`,`Parce que le RRS a été supprimé`,`Pour limiter la participation des batteries au marché`], correct:1,
 explain:`ECRS comble un besoin de réserve additionnelle sur un horizon plus long que le RRS classique, dans un contexte de fiabilité renforcée post-Uri — les batteries en ont rapidement capté une part significative grâce à leur flexibilité.`},
{id:'a4', theme:'ancillary', q:`Historiquement (avant RTC+B), comment les services auxiliaires étaient-ils majoritairement clairés en ERCOT ?`,
 options:[`Exclusivement en temps réel, minute par minute`,`Majoritairement via une procurement dans le Day-Ahead Market (DAM), avec déploiement réel ensuite`,`Uniquement par contrats bilatéraux privés`,`Ils n'étaient jamais clairés, seulement estimés`], correct:1,
 explain:`Avant RTC+B, l'essentiel du volume AS était acheté dans le DAM (engagement J-1), le déploiement réel se faisant ensuite en temps réel — une mécanique plus rigide que le co-optimization continu introduit par RTC+B.`},
{id:'a5', theme:'ancillary', q:`Quel a été l'impact du fort développement du parc de batteries (14 GW+ en ERCOT) sur les revenus de services auxiliaires par MW ?`,
 options:[`Ils ont fortement augmenté grâce à la demande croissante`,`Ils se sont effondrés (baisse de l'ordre de -90% par MW entre 2023 et 2025), la demande de réserves étant structurellement bornée face à une offre en explosion`,`Ils sont restés parfaitement stables`,`Les batteries ont été interdites d'accès à ce marché`], correct:1,
 explain:`La part des AS dans le revenu total d'un BESS type est tombée d'environ 84% (2023) à ~48% (2025), avec un revenu par MW en chute de près de 90% — un cas d'école de saturation ("crowding") de marché.`},
{id:'a6', theme:'ancillary', q:`Sous RTC+B, comment les services auxiliaires sont-ils désormais procurés et dispatchés ?`,
 options:[`Toujours uniquement dans le Day-Ahead Market, sans changement`,`Co-optimisés avec l'énergie directement dans SCED, toutes les 5 minutes, via des courbes de demande (ASDC)`,`Ils ont été purement et simplement supprimés`,`Ils sont désormais fixés à un prix administré unique`], correct:1,
 explain:`RTC+B intègre les AS dans le dispatch temps réel (SCED) toutes les 5 minutes, co-optimisés avec l'énergie — permettant à une batterie de basculer beaucoup plus finement entre position énergie et position réserve selon l'opportunité instantanée.`},
{id:'a7', theme:'ancillary', q:`Pourquoi une batterie peut-elle être un meilleur pourvoyeur de RegUp/RegDown qu'une centrale à gaz ?`,
 options:[`Elle est moins chère à construire`,`Sa réponse est quasi instantanée et bidirectionnelle (charge ou décharge), avec un suivi de consigne (AGC) plus précis`,`Elle ne peut fournir que RegUp, jamais RegDown`,`Les centrales à gaz sont interdites de fournir ce service`], correct:1,
 explain:`La régulation de fréquence exige un suivi précis et rapide d'un signal (AGC) qui varie en permanence dans les deux sens — la réponse électronique quasi instantanée d'un onduleur surclasse la réponse mécanique/thermique d'une turbine.`},
{id:'a8', theme:'ancillary', q:`Quelle stratégie de revenu une batterie ERCOT privilégie-t-elle davantage en 2025-2026 par rapport à 2022-2023 ?`,
 options:[`Une dépendance quasi exclusive aux services auxiliaires`,`Un basculement marqué vers l'arbitrage énergie (spread capture), les AS devenant un complément et non plus le moteur principal`,`L'abandon total du marché de l'énergie`,`Une dépendance exclusive aux contrats de capacité, inexistants en ERCOT`], correct:1,
 explain:`Avec la saturation du marché AS, la part de l'arbitrage énergie dans le revenu type d'un BESS ERCOT est passée d'environ 25% à plus de 60-75% entre 2024 et 2025 — un renversement stratégique majeur.`},

/* ---------------- IMBALANCE / REAL-TIME ---------------- */
{id:'i1', theme:'imbalance', q:`Qu'est-ce que le "DA-RT basis" (base Day-Ahead / Real-Time) ?`,
 options:[`L'écart entre le prix clairé au Day-Ahead et le prix réel constaté en Real-Time, pour le même nœud/heure`,`Le prix moyen sur l'année`,`Un service auxiliaire spécifique`,`Le prix payé par les résidentiels`], correct:0,
 explain:`C'est l'un des risques centraux du trading power : un actif engagé au DAM à un prix donné peut voir le marché RT évoluer très différemment (spike ou effondrement) — particulièrement volatil en ERCOT lors d'événements météo extrêmes.`},
{id:'i2', theme:'imbalance', q:`Qu'est-ce qu'une "uninstructed deviation" pour une ressource dispatchée par SCED ?`,
 options:[`Un écart entre la production/consommation réelle et l'instruction (award) donnée par SCED, potentiellement sujet à pénalité`,`Une panne totale de l'actif`,`Un changement de propriétaire de l'actif`,`Un type de service auxiliaire`], correct:0,
 explain:`Si une ressource ne suit pas fidèlement son instruction SCED (par exemple une batterie qui ne respecte pas son SOC-target), l'écart est qualifié de déviation non instruite et peut être sanctionné — vigilance accrue sous RTC+B où le SOC est suivi en continu.`},
{id:'i3', theme:'imbalance', q:`Le risque de base géographique (locational basis risk) pour un actif de stockage désigne...`,
 options:[`Le risque que le prix reçu à son propre nœud diverge du prix d'un hub de référence utilisé dans ses contrats de couverture`,`Le risque de change devise`,`Le risque que la batterie soit physiquement déplacée`,`Le risque de taux d'intérêt`], correct:0,
 explain:`Si l'actif se couvre sur un hub (ex. North Hub) alors qu'il se règle physiquement à son propre nœud, toute congestion entre les deux crée un écart non couvert — d'où l'intérêt des Congestion Revenue Rights (CRR) ou de basis swaps.`},
{id:'i4', theme:'imbalance', q:`Pourquoi une position DAM pour une batterie est-elle intrinsèquement plus délicate à gérer que pour un générateur thermique classique ?`,
 options:[`Parce que les batteries ne peuvent pas participer au DAM`,`Parce que la faisabilité réelle en temps réel dépend du SOC, qui peut différer de l'hypothèse prise la veille lors de l'enchère DAM`,`Parce que le DAM n'existe pas pour le stockage`,`Parce que les batteries doivent payer une taxe spéciale au DAM`], correct:1,
 explain:`Un générateur thermique peut produire tant qu'il est disponible ; une batterie ne peut décharger que si elle a suffisamment de SOC, dépendant de son propre cycle précédent — la planification DAM doit intégrer une trajectoire de SOC prévisionnelle, qui peut être invalidée par les événements réels de la journée.`},
{id:'i5', theme:'imbalance', q:`Qu'appelle-t-on le "règlement d'imbalance" pour une ressource ayant un engagement Day-Ahead ?`,
 options:[`Le paiement/facturation de l'écart entre le volume clairé au DAM et le volume réellement produit/consommé en RT, valorisé au prix Real-Time`,`Une amende fixe indépendante du volume`,`Un crédit d'impôt fédéral`,`Un service auxiliaire spécifique au stockage`], correct:0,
 explain:`Toute différence entre l'engagement DAM et la réalité physique en RT est réglée ("cash out") au prix Real-Time — incitant à une prévision précise de la disponibilité réelle (SOC compris pour une batterie).`},
{id:'i6', theme:'imbalance', q:`En cas de spike de prix Real-Time non anticipé par le Day-Ahead, quel acteur en profite le plus, toutes choses égales par ailleurs ?`,
 options:[`Celui qui a une position longue non couverte en RT au moment du spike (ex. une batterie déchargeant à ce moment-là)`,`Celui qui a acheté au DAM la veille à prix bas et n'a plus aucune position en RT`,`Personne, les spikes RT n'affectent aucun acteur`,`Uniquement le régulateur ERCOT`], correct:0,
 explain:`Un acteur avec une position ouverte (long) au moment du pic RT capte la valeur du spike ; celui déjà entièrement flat via un engagement DAM n'en bénéficie pas sur ce volume — d'où l'enjeu stratégique de garder de la flexibilité de dispatch en RT pour une batterie merchant.`},
{id:'i7', theme:'imbalance', q:`Quel risque opérationnel le suivi de SOC en continu (5 min) sous RTC+B introduit-il pour l'éligibilité au Non-Spin ?`,
 options:[`Aucun changement, l'ancienne règle s'applique à l'identique`,`Une norme plus stricte : la batterie doit démontrer un SOC suffisant en continu, sous peine de perdre l'award de réserve`,`La batterie ne peut plus jamais fournir de Non-Spin`,`Le Non-Spin est désormais gratuit pour ERCOT`], correct:1,
 explain:`RTC+B impose une vérification de faisabilité SOC plus stricte et continue — une batterie qui promet du Non-Spin doit prouver, à chaque intervalle, qu'elle dispose bien de l'énergie stockée nécessaire pour honorer cet engagement si appelée.`},
{id:'i8', theme:'imbalance', q:`Un trader gérant le risque d'imbalance d'un portefeuille de batteries doit avant tout bien modéliser...`,
 options:[`Le taux de change EUR/USD`,`La trajectoire prévisionnelle de SOC de chaque actif dans le temps, en cohérence avec les positions DAM prises`,`Le nombre d'actionnaires du fonds propriétaire`,`La météo dans une zone sans lien avec les actifs`], correct:1,
 explain:`Parce que la capacité physique à honorer une position dépend du SOC, une gestion rigoureuse de l'imbalance pour un portefeuille de stockage passe avant tout par une prévision et un suivi fiables de la trajectoire de charge de chaque actif.`},

/* ---------------- CONTRACTS ---------------- */
{id:'c1', theme:'contracts', q:`Dans un PPA physique (Physical PPA), que se passe-t-il concrètement ?`,
 options:[`L'acheteur reçoit uniquement un paiement financier basé sur un indice, sans jamais recevoir d'énergie`,`Le vendeur livre réellement l'énergie à un point de livraison défini, et l'acheteur en prend le titre de propriété à ce point`,`Il n'y a aucun échange d'énergie ni d'argent`,`Le contrat ne concerne que les services auxiliaires`], correct:1,
 explain:`Le PPA physique implique une livraison réelle d'énergie à un point convenu (souvent un hub) : l'acheteur devient propriétaire de l'énergie à ce point et porte ensuite le risque de base jusqu'à son propre nœud de consommation.`},
{id:'c2', theme:'contracts', q:`Dans un PPA financier (Financial PPA / Virtual PPA), l'énergie est-elle physiquement livrée à l'acheteur ?`,
 options:[`Oui, systématiquement`,`Non — c'est un contrat purement financier (contract for differences) : le vendeur vend sa production sur le marché spot où il est raccordé, et règle séparément la différence avec l'acheteur contre un prix de référence`,`Seulement les jours de forte production`,`Uniquement si l'acheteur est un utility régulé`], correct:1,
 explain:`Le générateur écoule sa production réelle sur le marché spot (DAM/RTM) à son propre nœud. En parallèle, un swap financier règle la différence entre un prix fixe (strike) et un indice flottant — aucune énergie ne change matériellement de mains entre les deux contreparties du PPA.`},
{id:'c3', theme:'contracts', q:`Que signifie concrètement le qualificatif "all-in" pour un Financial PPA (prix fixe tout compris, "as produced") ?`,
 options:[`Le prix fixe s'applique à un volume contractuel fixe indépendant de la production réelle`,`Le prix fixe s'applique à 100% du volume réellement produit par l'actif, sans obligation de forme ni de volume ferme — la prime de risque de forme/volume/base est intégrée dans un prix unique`,`Le contrat inclut gratuitement l'entretien de l'actif`,`Il s'agit d'un contrat sans aucun prix, purement en nature`], correct:1,
 explain:`"All-in" signifie que le prix unique convenu couvre déjà, dans sa construction, les primes de risque de forme (shape), de volume et de base — l'acheteur paie/reçoit ce prix pour chaque MWh réellement produit, sans réconciliation de volume séparée.`},
{id:'c4', theme:'contracts', q:`Dans un Financial PPA indexé "DA" (Day-Ahead), quel risque résiduel le vendeur/générateur porte-t-il en plus du risque de base géographique ?`,
 options:[`Aucun risque supplémentaire`,`Le risque de base DA-RT : il est réellement payé au prix Real-Time pour son énergie physique, mais son PPA règle sur l'indice Day-Ahead`,`Le risque de taux de change`,`Le risque que l'acheteur change de nationalité`], correct:1,
 explain:`Comme la production physique est vendue au prix Real-Time mais le PPA se règle contre un indice Day-Ahead, tout écart de convergence entre DA et RT (fréquent en ERCOT lors d'événements extrêmes) devient un risque non couvert par le PPA lui-même.`},
{id:'c5', theme:'contracts', q:`Un Tolling Agreement pour une batterie, comment fonctionne-t-il ?`,
 options:[`Le propriétaire de l'actif touche un revenu fixe (fee) en échange de la cession des droits de dispatch à un "toller" (souvent un trader/optimiseur), qui capte l'intégralité du risque et de l'upside de marché`,`Le propriétaire garde 100% du risque de marché et ne paie aucune commission`,`C'est un synonyme exact de PPA physique`,`Il s'agit d'un prêt bancaire garanti par la batterie`], correct:0,
 explain:`Le tolling s'apparente à une location de la capacité de dispatch : le toller paie un fee fixe (souvent en $/MW-mois) et décide seul de la stratégie de trading ; le propriétaire est protégé de la volatilité de marché mais renonce à tout upside.`},
{id:'c6', theme:'contracts', q:`Quelle est la différence entre une structure "fully merchant", "merchant + floor" et "cap & floor / collar" ?`,
 options:[`Ce sont trois noms différents pour exactement la même structure`,`Fully merchant = 100% du risque/upside au propriétaire ; merchant+floor = plancher de revenu garanti avec conservation de l'upside ; cap & floor = revenu plafonné ET plancher, l'excédent au-delà du cap étant partagé/reversé au contrepartiste`,`Cap & floor signifie qu'il n'y a aucune limite de revenu`,`Merchant + floor signifie que le propriétaire ne touche jamais aucun revenu`], correct:1,
 explain:`Ces structures forment un continuum entre fully merchant (tout au propriétaire) et tolling (tout transféré) : le floor sécurise un minimum, le cap plafonne l'upside en échange — un compromis fréquent pour faciliter le financement tout en gardant du potentiel de hausse. Terminologie exacte ("collar", "corridor") variable selon les desks. Ne pas confondre avec un "TBX swap" (cf. thèmes Contrats/Couvertures) : un instrument différent, indexé sur l'écart de prix Day-Ahead plutôt que sur un plafond/plancher de revenu.`},
{id:'c7', theme:'contracts', q:`Pourquoi les batteries utilisent-elles plus souvent des tollings ou des "revenue puts" que des PPA financiers classiques (contrairement à l'éolien/solaire) ?`,
 options:[`Parce que les batteries ne peuvent pas signer de contrats à long terme`,`Parce que la production d'une batterie n'est pas un profil naturel dépendant de la météo, mais le résultat d'une décision de trading (dispatch), rendant difficile la définition d'un indice "as generated" simple à hedger comme pour du renouvelable`,`Parce que les banques refusent de financer les batteries`,`Parce que c'est interdit par la réglementation ERCOT`], correct:1,
 explain:`Point clé à maîtriser : l'éolien/solaire a un profil de production physique (météo) facilement référençable dans un PPA financier classique. Une batterie choisit quand charger/décharger — son "profil" dépend de la compétence de trading. D'où le recours à des structures qui isolent le risque de prix (tolling, revenue put sur indice proxy) du risque de performance opérationnelle.`},
{id:'c8', theme:'contracts', q:`Qu'est-ce qu'un "Revenue Put" (ou Proxy Revenue Swap) pour un actif de stockage ?`,
 options:[`Un instrument garantissant un plancher de revenu basé sur un indice/portefeuille de référence ("proxy"), et non sur la performance réelle de l'actif — le propriétaire garde le contrôle du dispatch et l'upside, mais achète une protection de prix de marché`,`Un contrat qui transfère la propriété physique de la batterie à la banque`,`Un synonyme de PPA physique`,`Un mécanisme de subvention publique`], correct:0,
 explain:`Contrairement au tolling (qui transfère la décision de dispatch), le revenue put laisse le propriétaire optimiser lui-même l'actif ; le règlement se fait contre un indice de référence théorique, isolant le risque de prix de marché du risque de performance opérationnelle (qui reste chez le propriétaire).`},
{id:'c9', theme:'contracts', q:`Dans un contrat de type Resource Adequacy / Capacity, que rémunère-t-on principalement ?`,
 options:[`L'énergie réellement produite, au MWh`,`La disponibilité/capacité accréditée de l'actif, indépendamment de l'énergie produite`,`Le nombre d'employés sur site`,`Le prix du gaz naturel`], correct:1,
 explain:`Ce type de paiement rémunère la disponibilité de capacité (souvent accréditée via une méthode comme l'ELCC pour le stockage) plutôt que l'énergie livrée — ERCOT, marché energy-only, n'a pas de marché de capacité centralisé comme PJM, même si des mécanismes de fiabilité complémentaires évoluent.`},
{id:'c10', theme:'contracts', q:`Quel est le principal risque, du point de vue du propriétaire, dans une structure fully merchant comparée à un tolling ?`,
 options:[`Aucun risque supplémentaire`,`Une exposition totale à la volatilité des prix, des spreads et des revenus AS — avec en contrepartie la possibilité de capter tout l'upside`,`Un risque de change devise uniquement`,`Le propriétaire ne peut jamais faire faillite dans ce cas`], correct:1,
 explain:`Fully merchant maximise le potentiel de revenu mais expose directement le propriétaire à la compression de spread, à la saturation AS, aux plafonds de prix réglementaires — d'où l'intérêt d'un hybride (floor, collar) pour sécuriser le financement tout en gardant du potentiel de hausse.`},
{id:'c11', theme:'contracts', q:`Une structure hybride où le toller paie 80% via un montant fixe et 20% via un partage de revenu est parfois qualifiée de...`,
 options:[`Tolling pur`,`Structure hybride type "put" : le propriétaire a une protection de baisse (les 80% fixes) tout en gardant une participation à la hausse (les 20% variables)`,`PPA physique standard`,`Un mécanisme de capacité réglementé`], correct:1,
 explain:`Ces structures hybrides combinent la sécurité d'un plancher de revenu fixe (fonction "put"/protection) avec une participation résiduelle au marché — un compromis courant entre tolling pur (0% d'upside) et fully merchant (100% d'upside).`},
{id:'c12', theme:'contracts', q:`Pour bien différencier deux contrats sur le terrain, quelle est LA question la plus utile à se poser en premier ?`,
 options:[`Le contrat prévoit-il une livraison physique d'énergie à un point donné, ou seulement un règlement financier sur indice ?`,`Quelle est la couleur du logo de la contrepartie ?`,`Le contrat est-il rédigé en anglais ou en français ?`,`Le contrat a-t-il été signé un lundi ou un mardi ?`], correct:0,
 explain:`Physique vs financier est la distinction structurante n°1. Viennent ensuite : qui contrôle le dispatch (propriétaire vs toller) ? et quel est le partage de risque de prix (fully merchant / floor / cap-floor / fixe) ? Ces trois questions permettent de classer n'importe quel contrat de la fiche Contrats.`},
{id:'c13', theme:'contracts', q:`Un collègue mentionne un contrat "TB4" sur une batterie. De quoi s'agit-il ?`,
 options:[`D'un Cap & Floor à 4 paliers de prix`,`D'un swap indexé sur le "Top-Bottom 4" : la moyenne des 4 prix Day-Ahead les plus hauts moins la moyenne des 4 prix Day-Ahead les plus bas de chaque journée — un indice de marché, pas la performance réelle de l'actif`,`D'un PPA physique avec 4 points de livraison`,`D'un service auxiliaire proposé par ERCOT`], correct:1,
 explain:`TB4 ("Top-Bottom 4") est un indice standard du secteur : pour chaque jour, on prend la moyenne des 4 prix Day-Ahead les plus élevés et on soustrait la moyenne des 4 prix Day-Ahead les plus bas. Il sert de benchmark théorique pour une batterie 4h (1 cycle/jour, prévision parfaite) et peut aussi servir de sous-jacent à un swap financier ("TBX swap") — à ne pas confondre avec un cap & floor, qui plafonne/plancher un revenu plutôt que de référencer un écart de prix journalier.`},

/* ---------------- VALUATION ---------------- */
{id:'v1', theme:'valuation', q:`Que désigne le "revenue stacking" pour un BESS ?`,
 options:[`Le fait de cumuler plusieurs sources de revenu (arbitrage énergie, services auxiliaires, capacité) sur un même actif au fil du temps`,`Un empilement physique de containers de batteries`,`Une méthode de dégradation accélérée volontaire`,`Un type de contrat juridique unique`], correct:0,
 explain:`Le revenue stacking consiste à optimiser un même actif sur plusieurs marchés (énergie DA/RT, AS, éventuellement capacité) pour maximiser le revenu total — la répartition optimale évolue dans le temps selon les conditions de marché.`},
{id:'v2', theme:'valuation', q:`Le LCOS (Levelized Cost of Storage) sert principalement à...`,
 options:[`Mesurer le coût unitaire moyen ($/MWh) de l'énergie stockée/restituée sur la durée de vie de l'actif, pour comparer différentes technologies/projets`,`Calculer le prix de vente réglementé de l'électricité`,`Fixer le prix des services auxiliaires`,`Mesurer la pollution sonore d'un site`], correct:0,
 explain:`Le LCOS ramène l'ensemble des coûts (capex, opex, augmentation, financement) au MWh d'énergie livrée sur la durée de vie — un indicateur côté coût, à mettre en regard du revenu stacking côté valorisation.`},
{id:'v3', theme:'valuation', q:`Pourquoi une simple "backtest à prévision parfaite" (perfect-foresight) surestime-t-elle la valeur réelle d'une batterie ?`,
 options:[`Elle ne surestime jamais rien, c'est la méthode la plus fiable`,`Elle suppose que le trader connaît par avance tous les prix futurs, ce qui n'est jamais le cas — la valeur réellement capturée sous incertitude est structurellement inférieure`,`Elle sous-estime systématiquement les coûts de dégradation`,`Elle ne peut être appliquée qu'aux batteries de plus de 4h`], correct:1,
 explain:`Un backtest à prévision parfaite optimise le dispatch a posteriori. L'écart entre valeur "perfect foresight" et valeur réellement capturable est un indicateur clé de la marge de progression (ou du risque de modèle) d'une stratégie d'optimisation.`},
{id:'v4', theme:'valuation', q:`Qu'est-ce que l'ELCC (Effective Load Carrying Capability) appliqué au stockage ?`,
 options:[`Une mesure du taux de dégradation annuel`,`Une méthode d'accréditation de la valeur de capacité d'un actif selon sa contribution réelle à la fiabilité du réseau, qui varie notamment avec la durée`,`Un type de service auxiliaire`,`Le coût d'installation par kWh`], correct:1,
 explain:`L'ELCC quantifie la contribution réelle d'un actif à la fiabilité ; pour le stockage, cette valeur décroît avec la pénétration cumulée et croît avec la durée — un facteur clé expliquant la tendance vers des durées plus longues (4h).`},
{id:'v5', theme:'valuation', q:`Dans l'arbitrage d'une batterie, quel est le compromis central entre "cycler plus" et "cycler moins" ?`,
 options:[`Cycler plus n'a aucun inconvénient`,`Plus de cycles = plus de revenu d'arbitrage potentiel, mais aussi une dégradation plus rapide et un coût d'augmentation/remplacement plus élevé — il existe un optimum économique`,`Cycler moins augmente toujours le revenu total`,`La réglementation ERCOT impose un nombre de cycles fixe par jour`], correct:1,
 explain:`Chaque cycle capture de la marge d'arbitrage mais use la batterie ; au-delà d'un certain point, le coût marginal de dégradation dépasse le revenu marginal — d'où un dispatch optimal, et non "cycler au maximum".`},
{id:'v6', theme:'valuation', q:`Par ordre d'importance actuelle (2025-2026), quels sont les principaux postes du revenu stack d'une batterie merchant type en ERCOT ?`,
 options:[`100% capacité réglementée`,`Majoritairement arbitrage énergie (spread capture), puis services auxiliaires en complément`,`100% services auxiliaires uniquement`,`100% subventions fédérales directes`], correct:1,
 explain:`Le renversement récent place l'arbitrage énergie en tête (environ 60-75% du revenu), les AS étant devenus un complément plutôt que le moteur principal, du fait de la saturation de ce dernier marché.`},
{id:'v7', theme:'valuation', q:`Dans un modèle NPV/IRR d'un BESS, quel paramètre technique influence le plus directement la marge captable par cycle d'arbitrage ?`,
 options:[`Le rendement aller-retour (RTE)`,`La couleur des containers`,`Le nom du fabricant sur la plaque signalétique`,`Le nombre d'actionnaires du fonds`], correct:0,
 explain:`Un RTE plus faible réduit mécaniquement l'énergie effectivement restituée pour une même énergie chargée, rognant directement la marge capturée — à auditer avec soin (RTE constructeur vs RTE réel mesuré, auxiliaires inclus).`},
{id:'v8', theme:'valuation', q:`Pourquoi le "cannibalization risk" est-il pertinent pour la valorisation long terme d'un portefeuille de batteries ERCOT ?`,
 options:[`Ce n'est pas pertinent, le marché ERCOT est illimité en taille`,`Plus il y a de batteries et de solaire exploitant la même fenêtre d'arbitrage (creux midi, pointe soir), plus ce spread tend à se comprimer avec le temps — un risque structurel à intégrer dans les projections`,`Cela ne concerne que les centrales nucléaires`,`Cela désigne uniquement la concurrence entre deux batteries d'un même propriétaire`], correct:1,
 explain:`Avec ~14 GW de batteries et une forte pénétration solaire (~40% avec l'éolien) exploitant la même poche de valeur, le spread s'auto-comprime à mesure que la capacité installée augmente — déjà documenté sur les revenus AS, en cours sur l'arbitrage énergie.`},
{id:'v9', theme:'valuation', q:`Quelle approche de valorisation est la plus robuste pour un actif merchant exposé à une forte volatilité de prix (comme une batterie ERCOT) ?`,
 options:[`Une simple moyenne historique des prix passés appliquée telle quelle`,`Une approche stochastique/Monte Carlo simulant de nombreux scénarios de prix, couplée à une optimisation de dispatch sous incertitude`,`Ignorer la volatilité et ne modéliser qu'un seul scénario central`,`Se baser uniquement sur les prévisions météo à 10 jours`], correct:1,
 explain:`Vu l'importance de la volatilité et des événements extrêmes (scarcity pricing, price caps) dans la valeur d'un actif optionnel comme une batterie, une approche probabiliste capture mieux la vraie distribution de valeur qu'un scénario déterministe unique.`},
{id:'v10', theme:'valuation', q:`Quel effet la baisse du plafond de prix RT (RTSWCAP à 2 000 $/MWh sous RTC+B, contre 5 000 $/MWh en DA) a-t-elle sur la valorisation d'une batterie comptant sur les pics de rareté en temps réel ?`,
 options:[`Aucun effet, les plafonds ne s'appliquent jamais en pratique`,`Elle réduit le potentiel de revenu de rareté capturable en Real-Time, déplaçant une partie de la valeur espérée vers le Day-Ahead — un paramètre réglementaire à réviser dans les modèles`,`Elle augmente le revenu RT sans aucune limite`,`Elle concerne uniquement les centrales nucléaires`], correct:1,
 explain:`En segmentant le plafond entre DA (5 000$) et RT (2 000$), RTC+B réduit mécaniquement le revenu de rareté maximal capturable en temps réel — un changement structurel à refléter dans toute valorisation actualisée, illustrant aussi le risque réglementaire.`},
{id:'v11', theme:'valuation', q:`Qu'appelle-t-on le "capture rate" d'une batterie par rapport à un indice comme le TB4 ?`,
 options:[`Le taux de dégradation annuel de la batterie`,`Le pourcentage du revenu théorique de l'indice (ex. TB4) que l'actif parvient réellement à capter, compte tenu du RTE, des contraintes opérationnelles et du nombre de cycles réellement disponibles`,`Le taux de disponibilité contractuelle exigé par un tolling`,`Le pourcentage de services auxiliaires fournis par rapport à l'énergie`], correct:1,
 explain:`Le TB4 (ou tout TBX) suppose une prévision parfaite et un cycle optimal théorique ; la performance réelle d'un actif est presque toujours inférieure du fait du RTE (~85-92%), des contraintes physiques (SOC, C-rate) et d'un dispatch sous incertitude — le "capture rate" (revenu réel / revenu TBX) est le KPI standard pour mesurer cet écart entre benchmark théorique et performance opérationnelle réelle.`},

/* ---------------- RISK ---------------- */
{id:'r1', theme:'risk', q:`Le "basis risk" pour un actif de stockage recouvre en réalité deux dimensions distinctes. Lesquelles ?`,
 options:[`Le risque de change et le risque de taux d'intérêt`,`Le risque de base géographique (nœud vs hub) et le risque de base temporelle (Day-Ahead vs Real-Time)`,`Le risque climatique et le risque cyber`,`Le risque juridique et le risque fiscal`], correct:1,
 explain:`Bien distinguer ces deux bases est essentiel : la base géographique vient de la congestion réseau (nœud physique vs hub de règlement contractuel), la base temporelle vient de l'écart de convergence entre marché Day-Ahead et marché Real-Time.`},
{id:'r2', theme:'risk', q:`Le "dispatch risk" (risque d'optimisation) pour une batterie merchant désigne...`,
 options:[`Le risque que l'algorithme/trader ne capture pas la valeur optimale du marché (ex. batterie déchargée au mauvais moment, ou insuffisamment chargée avant un pic de prix)`,`Le risque que la batterie explose physiquement`,`Le risque de change devise`,`Le risque que le fabricant fasse faillite`], correct:0,
 explain:`Contrairement à un actif passif, la valeur d'une batterie dépend directement de la qualité des décisions de dispatch — une mauvaise anticipation ou un mauvais positionnement de SOC avant un pic de prix se traduit directement par une perte d'opportunité.`},
{id:'r3', theme:'risk', q:`Le risque de dégradation (performance risk) impacte principalement...`,
 options:[`Uniquement le prix de l'électricité sur le marché`,`La capacité énergétique réellement disponible dans le temps, donc le revenu futur et le respect d'éventuels engagements contractuels`,`Le taux de change`,`Le nombre d'employés du site`], correct:1,
 explain:`Une dégradation plus rapide que prévu réduit l'énergie disponible pour l'arbitrage/les AS, peut déclencher des clauses de performance dans un tolling, et accélère le calendrier (et le coût) d'augmentation prévu au business plan.`},
{id:'r4', theme:'risk', q:`Le risque de contrepartie (counterparty/credit risk) dans un Revenue Put s'illustre par quel scénario ?`,
 options:[`La banque qui a vendu le put fait défaut au moment où le put est "in the money" et devrait payer le propriétaire de l'actif`,`Le prix de marché ne bouge jamais`,`La batterie tombe en panne`,`Le régulateur augmente les taxes`], correct:0,
 explain:`Comme pour tout dérivé OTC, le risque que la contrepartie ne puisse honorer son engagement quand le contrat lui est défavorable est réel — d'où l'importance de la collatéralisation (CSA/ISDA), de limites de crédit, et de la diversification des contreparties.`},
{id:'r5', theme:'risk', q:`Le "curtailment risk" pour un actif en ERCOT désigne...`,
 options:[`Le risque qu'ERCOT ordonne de réduire/arrêter la production ou la charge d'un actif pour des raisons de fiabilité réseau ou de congestion, réduisant le revenu attendu`,`Le risque que le prix de l'électricité augmente`,`Le risque de change devise`,`Un type d'assurance obligatoire`], correct:0,
 explain:`Bien que plus documenté pour l'éolien/solaire, le curtailment peut aussi affecter une batterie (instruction de ne pas charger/décharger pour des raisons de contrainte réseau), avec un impact direct sur le revenu réalisable ce jour-là.`},
{id:'r6', theme:'risk', q:`Le risque réglementaire (regulatory risk) pour un portefeuille de batteries ERCOT peut se matérialiser par quel type d'événement ?`,
 options:[`Un changement du plafond de prix système (ex. de 9 000$ à 5 000$/MWh), ou une réforme de marché comme RTC+B modifiant les règles de participation et de rémunération`,`Uniquement des événements internationaux sans lien avec ERCOT`,`Le changement de logo d'ERCOT`,`La météo`], correct:0,
 explain:`Les décisions du PUCT et d'ERCOT (règles de marché, plafonds de prix, mécanismes comme RTC+B) redéfinissent régulièrement l'enveloppe de revenu potentiel des actifs — un risque à suivre en continu, distinct du risque de marché pur.`},
{id:'r7', theme:'risk', q:`Pourquoi la saturation du marché des services auxiliaires est-elle un risque de type "cannibalisation" plutôt qu'un simple risque de prix ponctuel ?`,
 options:[`Parce qu'elle est structurelle et liée à la croissance cumulée de l'offre (MW de batteries), pas à un événement ponctuel — elle tend à s'aggraver avec le temps plutôt qu'à se résorber seule`,`Parce qu'elle ne dure qu'une seule journée par an`,`Parce qu'elle n'affecte que les centrales à charbon`,`Parce qu'elle est causée uniquement par la météo`], correct:0,
 explain:`Le risque de cannibalisation est structurel et de moyen-long terme, résultant de l'ajout cumulatif de capacité concurrente sur un pool de valeur borné — à modéliser comme une tendance de fond, pas comme un choc temporaire.`},
{id:'r8', theme:'risk', q:`Un actif avec un engagement de disponibilité minimale dans un Tolling Agreement, mais une dégradation plus rapide que prévu, s'expose à quel risque contractuel ?`,
 options:[`Aucun risque, le tolling protège de tout`,`Un risque de non-respect de la clause de performance/disponibilité, pouvant entraîner des pénalités (liquidated damages) au bénéfice du toller`,`Un bonus automatique de la part du toller`,`La résiliation automatique en faveur du propriétaire`], correct:1,
 explain:`Le tolling protège le propriétaire du risque de PRIX marché, mais pas du risque de PERFORMANCE de son propre actif — s'il ne peut plus délivrer la capacité promise, il reste responsable contractuellement, généralement via des pénalités de disponibilité.`},
{id:'r9', theme:'risk', q:`Le risque de base DA-RT concerne-t-il surtout les acteurs ayant des positions Day-Ahead importantes, ou est-il indifférent au profil de trading ?`,
 options:[`Il est indifférent, tous les acteurs y sont exposés de façon identique quel que soit leur profil`,`Il concerne surtout les acteurs qui prennent des engagements Day-Ahead significatifs (ex. via un PPA indexé DA, ou une stratégie de trading DAM active) ; un acteur purement flat en RT y est peu exposé`,`Il ne concerne que les particuliers`,`Il a disparu depuis l'introduction de RTC+B`], correct:1,
 explain:`Plus une stratégie ou un contrat s'appuie sur le marché Day-Ahead (Financial PPA indexé DA, couverture DAM active), plus l'exposition à la convergence DA-RT devient significative — un acteur essentiellement exposé au Real-Time n'a pas ce risque de base temporelle (mais en a d'autres, liés à la volatilité RT elle-même).`},
{id:'r10', theme:'risk', q:`Face à l'ensemble de ces risques (prix, base, dégradation, contrepartie, réglementaire, cannibalisation), quelle affirmation résume le mieux l'approche middle office ?`,
 options:[`Ignorer les risques réglementaires, non quantifiables`,`Identifier, quantifier et suivre chaque risque séparément (VaR/stress tests pour le prix, suivi de SOH pour la dégradation, limites de crédit pour la contrepartie, veille réglementaire dédiée...) plutôt que de les traiter comme un risque unique indifférencié`,`Se reposer uniquement sur l'assurance dommage classique`,`Considérer que seule la météo compte`], correct:1,
 explain:`Le rôle du middle office est précisément de décomposer et suivre chaque type de risque avec les outils adaptés — c'est cette granularité qui permet un hedging et un reporting pertinents.`},

/* ---------------- HEDGING ---------------- */
{id:'h1', theme:'hedging', q:`Pourquoi dit-on que la valeur économique d'une batterie s'apparente à une option plutôt qu'à un flux de production classique ?`,
 options:[`Parce qu'elle produit en continu comme une centrale thermique`,`Parce que son propriétaire choisit chaque jour QUAND charger/décharger selon les prix — sa valeur dépend de la volatilité et de la forme du prix (spread), pas seulement de son niveau moyen`,`Parce qu'elle ne peut fonctionner que les jours de bourse`,`Parce qu'elle n'a aucune valeur financière propre`], correct:1,
 explain:`Une batterie capture de la valeur en exploitant l'écart entre prix bas (charge) et prix haut (décharge) — un profil de payoff proche d'une option ou d'une série d'options de spread. Plus la volatilité et l'amplitude des spreads sont élevées, plus la valeur de l'actif est grande.`},
{id:'h2', theme:'hedging', q:`Un swap prix fixe contre prix flottant (fixed-for-floating) permet de couvrir principalement quel type de risque ?`,
 options:[`Le risque de dégradation technique de la batterie`,`Le risque de niveau de prix (price risk) sur un volume donné`,`Le risque de contrepartie uniquement`,`Le risque météo`], correct:1,
 explain:`Un swap classique fixe le prix reçu/payé sur un volume notionnel, neutralisant l'exposition au niveau de prix flottant — mais ne couvre ni le risque de base, ni le risque de volume/dispatch, qui nécessitent d'autres instruments.`},
{id:'h3', theme:'hedging', q:`Pourquoi un simple swap fixe-flottant est-il un hedge imparfait pour une batterie (contrairement à un générateur baseload) ?`,
 options:[`Parce que le volume "produit" par une batterie n'est pas un profil physique fixe mais dépend d'une décision de dispatch — un swap sur un volume notionnel fixe ne colle pas naturellement à ce profil variable et discrétionnaire`,`Parce que les swaps sont interdits sur le marché de l'électricité`,`Parce qu'une batterie ne peut jamais avoir de position financière`,`Parce que les swaps ne peuvent porter que sur le gaz naturel`], correct:0,
 explain:`Même problème structurel qu'avec les PPA financiers classiques : la production d'une batterie est un choix, pas un profil météo. Un swap sur un volume fixe suppose un profil donné à l'avance, ce qui contredit la nature même de l'optionalité de dispatch qui fait la valeur de l'actif.`},
{id:'h4', theme:'hedging', q:`Quel type d'option financière se rapproche le plus, économiquement, du payoff d'un cycle d'arbitrage d'une batterie ?`,
 options:[`Une option de change (FX option)`,`Une option sur écart de prix (spread option), capturant la différence entre deux prix (ex. prix de décharge - prix de charge)`,`Une option sur taux d'intérêt`,`Un contrat à terme sans optionalité`], correct:1,
 explain:`Le profit d'un cycle d'arbitrage ressemble économiquement au payoff d'une spread option — les praticiens valorisent souvent une batterie comme une série ("strip") d'options de spread quotidiennes, analogue à une swing option.`},
{id:'h5', theme:'hedging', q:`Comment un Tolling Agreement fonctionne-t-il comme un hedge, du point de vue du propriétaire de l'actif ?`,
 options:[`Il transfère intégralement le risque de prix/marché à un tiers (le toller) en échange d'un revenu fixe garanti — l'équivalent d'un hedge total mais au prix de tout l'upside`,`Il ne couvre absolument aucun risque`,`Il ne couvre que le risque de change`,`Il double le risque de marché du propriétaire`], correct:0,
 explain:`C'est la forme de couverture la plus complète disponible pour un actif merchant : le propriétaire échange toute la volatilité de revenu contre un flux fixe et prévisible — souvent recherché pour sécuriser un financement de dette senior.`},
{id:'h6', theme:'hedging', q:`Comment un Revenue Put permet-il de couvrir le risque de prix tout en gardant le contrôle opérationnel de l'actif, contrairement à un tolling ?`,
 options:[`Ce n'est pas possible, ces deux objectifs sont mutuellement exclusifs`,`Le règlement du put se fait sur un indice/proxy théorique plutôt que sur la performance réelle du dispatch — le propriétaire garde la main sur les décisions de trading (et l'upside potentiel) tout en achetant une protection de prix`,`En vendant physiquement la batterie à la banque contrepartie`,`En signant un PPA physique classique`], correct:1,
 explain:`Différence structurelle clé : le tolling transfère la DÉCISION de dispatch, le revenue put transfère seulement le RISQUE DE PRIX (via un indice de référence), laissant le propriétaire libre d'optimiser lui-même l'actif et de capter la différence s'il fait mieux que l'indice.`},
{id:'h7', theme:'hedging', q:`Pour couvrir spécifiquement le risque de base géographique (congestion) d'un actif, quel instrument est le plus approprié ?`,
 options:[`Un Congestion Revenue Right (CRR) ou un basis swap entre le nœud de l'actif et le hub de référence`,`Un contrat d'assurance habitation`,`Une option sur le taux de change EUR/USD`,`Un abonnement de télémétrie SCADA`], correct:0,
 explain:`Les CRR (droits financiers de congestion) et les basis swaps sont conçus précisément pour fermer l'écart entre le prix d'un nœud spécifique et un hub de référence — l'outil dédié pour le risque de base géographique.`},
{id:'h8', theme:'hedging', q:`Pourquoi le risque de prix des services auxiliaires (AS) est-il généralement plus difficile à couvrir financièrement que le risque de prix énergie ?`,
 options:[`Parce que les marchés AS manquent de produits dérivés long terme standardisés et liquides, contrairement aux marchés d'énergie plus matures — la gestion se fait donc surtout par diversification et pilotage court terme`,`Parce que les prix AS sont toujours nuls`,`Parce que les services auxiliaires sont interdits aux acteurs financiers`,`Parce qu'il n'existe aucun risque sur les prix AS`], correct:0,
 explain:`Le manque de produits dérivés standardisés et liquides sur les prix AS limite les possibilités de couverture long terme — la gestion du risque AS reste largement opérationnelle plutôt que purement financière.`},
{id:'h9', theme:'hedging', q:`Un collar (achat d'un floor + vente d'un cap) appliqué au revenu merchant d'une batterie a pour effet de...`,
 options:[`Garantir un revenu parfaitement fixe, identique à un tolling`,`Réduire la volatilité du revenu en bornant à la fois la baisse (floor) et la hausse (cap), souvent à coût net réduit car la vente du cap finance l'achat du floor`,`Augmenter indéfiniment le revenu potentiel sans aucune limite`,`N'avoir aucun effet sur le profil de risque`], correct:1,
 explain:`Le collar est une structure "costless" ou à coût réduit classique : on renonce à l'upside au-delà du cap pour financer l'achat de la protection floor — un compromis pour sécuriser le financement tout en gardant un revenu partiellement variable.`},
{id:'h10', theme:'hedging', q:`Quelle est la bonne séquence de raisonnement pour choisir une stratégie de couverture adaptée à un actif de stockage donné ?`,
 options:[`Copier systématiquement la structure utilisée par le projet voisin, sans analyse`,`Identifier d'abord les risques matériels (prix, base, volume/dispatch, contrepartie), puis choisir les instruments/contrats (swap, option, collar, tolling, revenue put, CRR) qui adressent chacun spécifiquement, en tenant compte du coût et de l'impact sur le financement`,`Acheter le contrat le moins cher, quel que soit le risque couvert`,`Ne jamais couvrir un actif de stockage, le hedging serait toujours contre-productif`], correct:1,
 explain:`Une démarche de hedging rigoureuse part toujours de l'identification précise des risques, avant de sélectionner l'instrument le plus adapté à CHAQUE risque — un même actif peut combiner plusieurs couvertures partielles plutôt qu'une solution unique.`},
{id:'h11', theme:'hedging', q:`Comment fonctionne concrètement un "TBX swap" (ex. TB2 ou TB4) comme instrument de couverture pour une batterie ?`,
 options:[`Il transfère la propriété physique de la batterie au contrepartiste`,`C'est un swap fixe contre flottant : le propriétaire reçoit un montant fixe ($/MW-an) et paie/reçoit la valeur flottante de l'indice TBX réalisé chaque jour — sans que le contrepartiste n'intervienne dans le dispatch réel de l'actif`,`Il garantit que la batterie captera exactement 100% du spread journalier`,`Il ne peut être utilisé que pour des actifs éoliens`], correct:1,
 explain:`Le TBX swap est un swap fixe-flottant classique construit sur un indice de marché (TB2, TB4...) plutôt que sur la production réelle : le propriétaire sécurise un revenu fixe et cède l'exposition à la volatilité de l'indice, mais garde l'entière responsabilité du dispatch réel de son actif — d'où un risque de "capture rate" résiduel s'il performe moins bien que l'indice.`},

{id:'o6', theme:'orders', q:`Ordre de grandeur d'un spread d'arbitrage journalier "exploitable" régulièrement en ERCOT (hors événements extrêmes) ?`,

{id:'o7', theme:'orders', q:`Ordre de grandeur de la baisse du revenu de services auxiliaires par MW pour une batterie ERCOT entre 2023 et 2025 ?`,

{id:'o9', theme:'orders', q:`Quelle est la tendance de durée pour un nouveau projet BESS ERCOT, comparée aux tout premiers projets (souvent 1h) ?`,
